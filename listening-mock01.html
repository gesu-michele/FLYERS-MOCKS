<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Flyers Mock 01 - Listening | Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-sky: #dcf2ff;
      --bubble-cyan: #00c4cc;
      --bubble-blue: #0284c7;
      --bubble-yellow: #ffb800;
      --bubble-orange: #ff5722;
      --bubble-green: #00d084;
      --bubble-purple: #7928ca;
      --text-dark: #121829;
      --text-sub: #334155;
      --white: #ffffff;
      --card-border: #a5d8ff;
      --correct: #00d084;
      --wrong: #ff5722;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #b3e0ff 0%, #dbf0ff 40%, #fff2d6 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      font-size: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .glowing-aura {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 7s ease-in-out infinite alternate;
    }
    .aura-cyan { width: 550px; height: 550px; background: rgba(0, 196, 204, 0.4); top: -120px; left: -100px; }
    .aura-yellow { width: 620px; height: 620px; background: rgba(255, 184, 0, 0.35); bottom: -120px; right: -100px; animation-delay: -3.5s; }
    .aura-purple { width: 480px; height: 480px; background: rgba(121, 40, 202, 0.28); top: 35%; right: 25%; animation-delay: -5s; }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.65; }
      50% { transform: scale(1.22) translate(35px, 25px); opacity: 1; filter: blur(120px); }
      100% { transform: scale(0.92) translate(-25px, -18px); opacity: 0.65; }
    }

    .top-nav {
      height: 86px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn-back-home {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-radius: 999px;
      padding: 10px 24px;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-sub);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .btn-back-home:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #cbd5e1; }

    .exam-tag {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      color: #0b5cab;
      background: #e1f2ff;
      border: 3px solid #bfe3ff;
      padding: 10px 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-badge {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      color: #523100;
      background: #fff3cc;
      border: 3.5px solid #ffcc00;
      padding: 8px 24px;
      border-radius: 999px;
      box-shadow: 0 5px 0 #e6b800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-wrap {
      max-width: 1240px;
      width: 100%;
      margin: 30px auto 50px auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .exam-card {
      background: rgba(255, 255, 255, 0.98);
      border: 5px solid var(--card-border);
      border-radius: 40px;
      padding: 42px;
      box-shadow: 0 18px 40px rgba(37, 117, 252, 0.16);
      position: relative;
    }

    .part-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 20px;
    }

    .part-title {
      font-family: 'Fredoka', cursive;
      font-size: 32px;
      color: #0b5cab;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .drive-audio-wrapper {
      background: #ffffff;
      border: 4px solid var(--bubble-cyan);
      border-radius: 28px;
      padding: 18px 22px;
      margin-bottom: 28px;
      box-shadow: 0 10px 24px rgba(0, 196, 204, 0.16);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .audio-header-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      color: #0b5cab;
    }

    .drive-audio-frame-box {
      width: 100%;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      background: #000000;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.35);
    }

    .drive-audio-frame-box iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .instructions-box {
      background: #f0f8ff;
      border-left: 10px solid var(--bubble-cyan);
      border-radius: 0 24px 24px 0;
      padding: 20px 28px;
      font-size: 21px;
      color: #1e293b;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.55;
    }

    /* PART 1 */
    .names-bank {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .name-pill {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      background: #ffffff;
      border: 4px solid var(--bubble-blue);
      color: var(--bubble-blue);
      padding: 12px 32px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--bubble-blue);
      transition: all 0.15s ease;
    }

    .name-pill.selected {
      background: var(--bubble-orange);
      border-color: #d83d0f;
      color: #ffffff;
      box-shadow: 0 0 26px rgba(255, 87, 34, 0.9), 0 6px 0 #b32a00;
      transform: scale(1.12);
    }

    .name-pill.used {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .stage-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      border-radius: 30px;
      overflow: hidden;
      border: 5px solid var(--card-border);
      box-shadow: 0 16px 36px rgba(0,0,0,0.12);
      background: #ffffff;
    }

    .stage-image { width: 100%; height: auto; display: block; }

    .drop-slot {
      position: absolute;
      transform: translate(-50%, -50%);
      min-width: 140px;
      padding: 10px 18px;
      border: 3.5px dashed #0070ba;
      background: rgba(255, 255, 255, 0.94);
      border-radius: 999px;
      text-align: center;
      font-family: 'Fredoka', cursive;
      font-size: 18px;
      font-weight: 700;
      color: #0070ba;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.2s ease;
      box-shadow: 0 6px 16px rgba(0,0,0,0.18);
    }

    .drop-slot:hover {
      background: #fff8e7;
      border-color: var(--bubble-orange);
      transform: translate(-50%, -50%) scale(1.1);
      box-shadow: 0 0 24px rgba(255, 87, 34, 0.7);
    }

    .drop-slot.filled {
      border: 3.5px solid var(--bubble-cyan);
      background: var(--bubble-cyan);
      color: white;
      box-shadow: 0 0 20px rgba(0, 196, 204, 0.6);
    }

    .drop-slot.example-slot {
      border: 3.5px solid var(--bubble-green);
      background: var(--bubble-green);
      color: white;
      cursor: default;
    }

    /* PART 2 */
    .diary-board {
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 32px;
      padding: 34px 44px;
      max-width: 860px;
      margin: 0 auto;
      box-shadow: 0 12px 28px rgba(37, 117, 252, 0.08);
    }

    .diary-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      padding: 18px 0;
      border-bottom: 3.5px dashed #e2e8f0;
      flex-wrap: wrap;
    }

    .diary-day {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      color: var(--bubble-blue);
      width: 170px;
    }

    .diary-field {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 14px;
      font-weight: 800;
      font-size: 21px;
    }

    .diary-input {
      font-family: 'Quicksand', sans-serif;
      font-size: 20px;
      font-weight: 800;
      padding: 12px 22px;
      border: 3.5px solid var(--card-border);
      border-radius: 18px;
      outline: none;
      width: 280px;
      color: #0b5cab;
      background: #f8fbfe;
      transition: all 0.2s;
    }
    .diary-input:focus {
      border-color: var(--bubble-cyan);
      background: #ffffff;
      box-shadow: 0 0 0 6px rgba(0, 196, 204, 0.25);
    }

    /* PART 3 */
    .part3-cambridge-container {
      display: grid;
      grid-template-columns: 450px 1fr;
      gap: 30px;
      align-items: start;
    }

    .friends-list-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .friend-row-card {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 22px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 14px rgba(37, 117, 252, 0.06);
    }

    .friend-identity {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .art-frame-box {
      width: 82px;
      height: 82px;
      border-radius: 18px;
      border: 3px solid #cbd5e1;
      overflow: hidden;
      background: #f8fafc;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
    }

    .art-frame-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .art-frame-box svg {
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .friend-name-text {
      font-family: 'Fredoka', cursive;
      font-size: 26px;
      color: #0b5cab;
    }

    .letter-dropdown-cambridge {
      width: 64px;
      height: 64px;
      border: 3.5px solid var(--text-dark);
      border-radius: 14px;
      background: #ffffff;
      font-family: 'Fredoka', cursive;
      font-size: 30px;
      font-weight: 700;
      color: var(--bubble-orange);
      text-align: center;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
    }

    .letter-dropdown-cambridge:focus {
      border-color: var(--bubble-cyan);
      box-shadow: 0 0 14px rgba(0, 196, 204, 0.6);
    }

    .example-box-fixed {
      width: 64px;
      height: 64px;
      border: 3.5px solid #0d8a44;
      border-radius: 14px;
      background: #dcfce7;
      font-family: 'Fredoka', cursive;
      font-size: 34px;
      font-weight: 700;
      color: #0d8a44;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .workplaces-grid-column {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      background: #f8fbff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 20px;
    }

    .workplace-card-item {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 22px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 6px 14px rgba(0,0,0,0.06);
    }

    .workplace-art-wrap {
      width: 100%;
      height: 140px;
      border-radius: 16px;
      overflow: hidden;
      background: #ffffff;
      margin-bottom: 8px;
      border: 2.5px solid #e2e8f0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .workplace-art-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
    }

    .workplace-art-wrap svg {
      width: 100%;
      height: 100%;
      z-index: 1;
      display: block;
    }

    .letter-tag-bold {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      font-weight: 700;
      color: var(--bubble-blue);
    }

    /* PART 4 */
    .part4-question-card {
      background: #f8fbff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 26px;
      margin-bottom: 28px;
    }

    .part4-question-card.is-example {
      border-color: #86efac;
      background: #f0fdf4;
    }

    .p4-question-heading {
      font-family: 'Fredoka', cursive;
      font-size: 26px;
      color: #0b5cab;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .p4-visual-ref {
      margin-bottom: 16px;
      border-radius: 18px;
      overflow: hidden;
      border: 3px solid var(--card-border);
      background: #ffffff;
    }
    .p4-visual-ref img {
      width: 100%;
      height: auto;
      max-height: 270px;
      object-fit: contain;
      display: block;
    }

    .p4-options-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .p4-box-choice {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-radius: 20px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
      box-shadow: 0 5px 0 #cbd5e1;
    }

    .p4-box-choice:hover {
      border-color: var(--bubble-cyan);
      transform: translateY(-3px);
      box-shadow: 0 7px 0 var(--bubble-cyan);
    }

    .p4-box-choice.selected {
      border-color: #0d8a44;
      background: var(--bubble-green);
      color: #ffffff;
      box-shadow: 0 6px 0 #0d8a44;
      transform: scale(1.04);
    }

    .p4-box-choice.fixed-example {
      border-color: #15803d;
      background: #22c55e;
      color: #ffffff;
      cursor: default;
      box-shadow: none;
    }

    /* PART 5 */
    .part5-canvas-stage-wrap {
      position: relative;
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      border-radius: 30px;
      overflow: hidden;
      border: 5px solid var(--card-border);
      box-shadow: 0 16px 36px rgba(0,0,0,0.12);
      background: #ffffff;
      touch-action: none;
    }

    .part5-canvas-stage-wrap img {
      width: 100%;
      height: auto;
      display: block;
      user-select: none;
      pointer-events: none;
    }

    #drawingCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      z-index: 5;
    }

    .canvas-tools-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
      flex-wrap: wrap;
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 30px;
      padding: 14px 22px;
      box-shadow: 0 8px 20px rgba(37, 117, 252, 0.08);
    }

    .canvas-tool-btn {
      font-family: 'Fredoka', cursive;
      font-size: 18px;
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 999px;
      border: 2.5px solid #cbd5e1;
      background: #f8fafc;
      color: #334155;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 0 #cbd5e1;
    }
    .canvas-tool-btn:hover {
      border-color: var(--bubble-cyan);
      transform: translateY(-2px);
    }
    .canvas-tool-btn.active {
      background: var(--bubble-blue);
      border-color: #0369a1;
      color: #ffffff;
      box-shadow: 0 4px 0 #075985;
      transform: scale(1.05);
    }

    .c-palette-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 3.5px solid white;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      transition: transform 0.15s ease;
    }
    .c-palette-btn:hover { transform: scale(1.2); }
    .c-palette-btn.active {
      transform: scale(1.28);
      border-color: #0f172a;
      box-shadow: 0 0 16px rgba(0,0,0,0.4);
    }

    .part5-writing-card {
      background: #f8fbff;
      border: 4px solid var(--card-border);
      border-radius: 28px;
      padding: 24px 30px;
      max-width: 960px;
      margin: 26px auto 0 auto;
      box-shadow: 0 8px 20px rgba(37, 117, 252, 0.08);
    }

    .part5-writing-input {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      font-weight: 700;
      padding: 12px 24px;
      border: 3.5px solid var(--bubble-blue);
      border-radius: 18px;
      background: #ffffff;
      color: #0b5cab;
      outline: none;
      min-width: 260px;
      margin-top: 10px;
    }
    .part5-writing-input:focus {
      border-color: var(--bubble-cyan);
      box-shadow: 0 0 0 6px rgba(0, 196, 204, 0.25);
    }

    /* FEEDBACK PANEL */
    .feedback-panel-card {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 28px;
      padding: 28px 32px;
      max-width: 900px;
      margin: 28px auto 0 auto;
      text-align: left;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
    }

    .feedback-part-title {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      color: #0b5cab;
      border-bottom: 2.5px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 20px;
      margin-bottom: 12px;
    }
    .feedback-part-title:first-child { margin-top: 0; }

    .feedback-item-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      font-size: 18px;
      line-height: 1.45;
    }

    .fb-tag {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .fb-correct { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
    .fb-wrong { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

    .bottom-bar {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      flex-wrap: wrap;
    }

    .btn-act {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 18px 42px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .btn-next {
      background: linear-gradient(180deg, #2fd277 0%, #15b35c 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #0d8a44, 0 12px 24px rgba(21, 179, 92, 0.4);
    }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #0d8a44; }

    .btn-prev {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      color: #64748b;
      box-shadow: 0 6px 0 #94a3b8;
    }

    @media (max-width: 980px) {
      .part3-cambridge-container { grid-template-columns: 1fr; }
      .workplaces-grid-column { grid-template-columns: repeat(2, 1fr); }
      .top-nav { padding: 0 20px; }
      .exam-card { padding: 24px; }
      .p4-options-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="glowing-aura aura-cyan"></div>
  <div class="glowing-aura aura-yellow"></div>
  <div class="glowing-aura aura-purple"></div>

  <header class="top-nav">
    <a href="index.html" class="btn-back-home" onclick="stopAllAudio()">⬅ Exit to Map</a>
    <div class="exam-tag"><span>🎧</span> Mock 01 • Listening Practice</div>
    <div class="timer-badge">
      <span>⏰</span> <span id="timerTxt">45:00</span>
      <span style="font-size:14px; color:#78350f; font-weight:700;">(Practice Mode)</span>
    </div>
  </header>

  <main class="main-wrap">
    <div class="exam-card" id="examMount">
      <!-- CABECERA Y AUDIO PERSISTENTE (NUNCA SE REINICIA CON LOS CLICS) -->
      <div id="partHeaderHost"></div>
      <div id="persistentAudioHost"></div>
      <div id="instructionsHost"></div>

    function setupCanvasElement() {
      const canvas = document.getElementById('drawingCanvas');
      const img = document.getElementById('snowSceneImage');
      if (!canvas || !img) return;

      canvas.width = img.clientWidth || 960;
      canvas.height = img.clientHeight || 580;
      canvasCtx = canvas.getContext('2d');

      redrawAllStrokesFromHistory();

      canvas.addEventListener('mousedown', onPointerStart);
      canvas.addEventListener('mousemove', onPointerMove);
      canvas.addEventListener('mouseup', onPointerEnd);
      canvas.addEventListener('mouseleave', onPointerEnd);

      canvas.addEventListener('touchstart', (e) => {
        e.preventDefault();
        onPointerStart(e.touches[0]);
      }, { passive: false });

      canvas.addEventListener('touchmove', (e) => {
        e.preventDefault();
        onPointerMove(e.touches[0]);
      }, { passive: false });

      canvas.addEventListener('touchend', (e) => {
        e.preventDefault();
        onPointerEnd();
      }, { passive: false });
    }

    let activeStrokeData = null;

    function getNormalizedCanvasCoords(e) {
      const canvas = document.getElementById('drawingCanvas');
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) / rect.width;
      const y = (e.clientY - rect.top) / rect.height;
      return {
        normX: Math.max(0, Math.min(1, x)),
        normY: Math.max(0, Math.min(1, y)),
        pixelX: e.clientX - rect.left,
        pixelY: e.clientY - rect.top
      };
    }

    function getColorRgba(hex) {
      const found = part5ExpandedPalette.find(p => p.hex === hex);
      return found ? found.rgba : "rgba(234, 179, 8, 0.48)";
    }

    function onPointerStart(e) {
      isDrawingOnCanvas = true;
      const pos = getNormalizedCanvasCoords(e);

      canvasCtx.beginPath();
      canvasCtx.moveTo(pos.pixelX, pos.pixelY);

      activeStrokeData = {
        tool: currentDrawingTool,
        color: currentDrawingColor,
        points: [{ x: pos.normX, y: pos.normY }]
      };
    }

    function onPointerMove(e) {
      if (!isDrawingOnCanvas || !canvasCtx) return;
      const pos = getNormalizedCanvasCoords(e);

      if (currentDrawingTool === 'eraser') {
        canvasCtx.globalCompositeOperation = 'destination-out';
        canvasCtx.lineWidth = 26;
      } else if (currentDrawingTool === 'pencil') {
        canvasCtx.globalCompositeOperation = 'source-over';
        canvasCtx.strokeStyle = currentDrawingColor;
        canvasCtx.lineWidth = 4.5;
        canvasCtx.lineCap = 'round';
        canvasCtx.lineJoin = 'round';
      } else { 
        canvasCtx.globalCompositeOperation = 'multiply';
        canvasCtx.strokeStyle = getColorRgba(currentDrawingColor);
        canvasCtx.lineWidth = 20;
        canvasCtx.lineCap = 'round';
        canvasCtx.lineJoin = 'round';
      }

      canvasCtx.lineTo(pos.pixelX, pos.pixelY);
      canvasCtx.stroke();

      if (activeStrokeData) {
        activeStrokeData.points.push({ x: pos.normX, y: pos.normY });
      }
    }

    function onPointerEnd() {
      if (isDrawingOnCanvas && activeStrokeData) {
        userAnswers.p5.canvasStrokes.push(activeStrokeData);
      }
      isDrawingOnCanvas = false;
      activeStrokeData = null;
    }

    function redrawAllStrokesFromHistory() {
      const canvas = document.getElementById('drawingCanvas');
      if (!canvas || !canvasCtx) return;
      canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

      userAnswers.p5.canvasStrokes.forEach(stk => {
        if (!stk.points || stk.points.length < 2) return;
        canvasCtx.beginPath();
        if (stk.tool === 'eraser') {
          canvasCtx.globalCompositeOperation = 'destination-out';
          canvasCtx.lineWidth = 26;
        } else if (stk.tool === 'pencil') {
          canvasCtx.globalCompositeOperation = 'source-over';
          canvasCtx.strokeStyle = stk.color;
          canvasCtx.lineWidth = 4.5;
          canvasCtx.lineCap = 'round';
          canvasCtx.lineJoin = 'round';
        } else {
          canvasCtx.globalCompositeOperation = 'multiply';
          canvasCtx.strokeStyle = getColorRgba(stk.color);
          canvasCtx.lineWidth = 20;
          canvasCtx.lineCap = 'round';
          canvasCtx.lineJoin = 'round';
        }

        canvasCtx.moveTo(stk.points[0].x * canvas.width, stk.points[0].y * canvas.height);
        for (let i = 1; i < stk.points.length; i++) {
          canvasCtx.lineTo(stk.points[i].x * canvas.width, stk.points[i].y * canvas.height);
        }
        canvasCtx.stroke();
      });
    }

    function clearCanvasCompletely() {
      userAnswers.p5.canvasStrokes = [];
      const canvas = document.getElementById('drawingCanvas');
      if (canvas && canvasCtx) {
        canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function setPart5DrawingTool(tool) {
      currentDrawingTool = tool;
      if (tool === 'pencil' && currentDrawingColor === '#eab308') {
        currentDrawingColor = '#1e293b';
      }

      ['crayon', 'pencil', 'eraser'].forEach(t => {
        const btn = document.getElementById(`btn_tool_${t}`);
        if (btn) {
          if (t === tool) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
    }

    function setPart5DrawingColor(hex) {
      currentDrawingColor = hex;
      if (currentDrawingTool === 'eraser') {
        setPart5DrawingTool('crayon');
      }

      part5ExpandedPalette.forEach(c => {
        const btn = document.getElementById(`btn_color_${c.hex.replace('#','')}`);
        if (btn) {
          if (c.hex === hex) btn.classList.add('active');
          else btn.classList.remove('active');
        }
      });
    }

    function savePart5CurrentWord() {
      const el = document.getElementById('p5_word_field');

        }

      // PART 3 FEEDBACK

        { friend: "alex", letter: "B", place: "Airport", clue: "Alex studied science and works at the airport." },
        { friend: "lucy", letter: "E", place: "Theatre", clue: "Lucy usually works on stage in the theatre." },
        { friend: "fred", letter: "A", place: "Chemist's shop", clue: "Fred sells medicines in a chemist's shop." },
        { friend: "katy", letter: "D", place: "Home", clue: "Katy works at home looking after children." }
      ];

      p3Map.forEach(item => {

      const hasBrownSkis = userAnswers.p5.canvasStrokes.some(stk =>

      if (wordOk) {

      const hasPurpleHouse = userAnswers.p5.canvasStrokes.some(stk => 
        stk.color === '#7928ca' && stk.points.some(p => p.x >= 0.38 && p.x <= 0.60 && p.y >= 0.16 && p.y <= 0.38)

      if (hasPurpleHouse) {

      const hasGreenBridge = userAnswers.p5.canvasStrokes.some(stk =>

      if (hasGreenBridge) {

          let st = JSON.parse(rawMocks);
          if (st[1]) {
            st[1].listeningScore = score;
            if (score >= 12) st[1].completed = true;
          }
          localStorage.setItem("flyers_mocks_status_01_30", JSON.stringify(st));
        } catch(e) {}

      currentPart = 6;

  </script>
