<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Flyers Mock 05 - Reading & Writing | Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-sky: #dcf2ff;
      --bubble-cyan: #00c4cc;
      --bubble-blue: #0284c7;
      --bubble-yellow: #ffb800;
      --bubble-orange: #ff5722;
      --bubble-green: #00d084;
      --bubble-purple: #7928ca;
      --text-dark: #121829;
      --text-sub: #334155;
      --white: #ffffff;
      --card-border: #a5d8ff;
      --correct: #00d084;
      --wrong: #ff5722;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #b3e0ff 0%, #dbf0ff 40%, #fff2d6 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      font-size: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .glowing-aura {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 7s ease-in-out infinite alternate;
    }
    .aura-cyan { width: 550px; height: 550px; background: rgba(0, 196, 204, 0.4); top: -120px; left: -100px; }
    .aura-yellow { width: 620px; height: 620px; background: rgba(255, 184, 0, 0.35); bottom: -120px; right: -100px; animation-delay: -3.5s; }
    .aura-purple { width: 480px; height: 480px; background: rgba(121, 40, 202, 0.28); top: 35%; right: 25%; animation-delay: -5s; }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.65; }
      50% { transform: scale(1.22) translate(35px, 25px); opacity: 1; filter: blur(120px); }
      100% { transform: scale(0.92) translate(-25px, -18px); opacity: 0.65; }
    }

    .top-nav {
      height: 86px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn-back-home {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-radius: 999px;
      padding: 10px 24px;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-sub);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .btn-back-home:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #cbd5e1; }

    .exam-tag {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      color: #0b5cab;
      background: #e1f2ff;
      border: 3px solid #bfe3ff;
      padding: 10px 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-badge {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      color: #523100;
      background: #fff3cc;
      border: 3.5px solid #ffcc00;
      padding: 8px 24px;
      border-radius: 999px;
      box-shadow: 0 5px 0 #e6b800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-wrap {
      max-width: 1240px;
      width: 100%;
      margin: 30px auto 50px auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .exam-card {
      background: rgba(255, 255, 255, 0.98);
      border: 5px solid var(--card-border);
      border-radius: 40px;
      padding: 42px;
      box-shadow: 0 18px 40px rgba(37, 117, 252, 0.16);
      position: relative;
    }

    .part-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 20px;
    }

    .part-title {
      font-family: 'Fredoka', cursive;
      font-size: 32px;
      color: #0b5cab;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .instructions-box {
      background: #f0f8ff;
      border-left: 10px solid var(--bubble-cyan);
      border-radius: 0 24px 24px 0;
      padding: 20px 28px;
      font-size: 21px;
      color: #1e293b;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.55;
    }

    .pill-bank {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      background: #f8fbff;
      padding: 20px;
      border-radius: 28px;
      border: 3.5px dashed var(--card-border);
    }

    .word-pill {
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      background: #ffffff;
      border: 3.5px solid var(--bubble-blue);
      color: var(--bubble-blue);
      padding: 8px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--bubble-blue);
      transition: all 0.15s ease;
    }
    .word-pill:hover { transform: translateY(-2px); }
    .word-pill.selected {
      background: var(--bubble-orange);
      border-color: #d83d0f;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 87, 34, 0.7), 0 5px 0 #b32a00;
      transform: scale(1.08);
    }
    .word-pill.used {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .reading-content-box {
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(37, 117, 252, 0.06);
    }

    .qa-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 2px dashed #e2e8f0;
      font-weight: 700;
      font-size: 20px;
    }
    .qa-row:last-child { border-bottom: none; }
    .qa-text { flex: 1; line-height: 1.5; }

    .interactive-line-slot {
      min-width: 220px;
      padding: 10px 18px;
      border: 3px dashed var(--bubble-blue);
      border-radius: 16px;
      background: #f8fbff;
      text-align: center;
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      color: var(--bubble-blue);
      cursor: pointer;
      transition: all 0.2s;
    }
    .interactive-line-slot.filled {
      border: 3px solid var(--bubble-cyan);
      background: var(--bubble-cyan);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 196, 204, 0.35);
    }
    .interactive-line-slot.example-slot {
      border: 3px solid var(--bubble-green);
      background: #dcfce7;
      color: #15803d;
      cursor: default;
    }

    .toggle-btn-group {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }
    .toggle-btn {
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      padding: 8px 24px;
      border-radius: 999px;
      border: 3px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover { transform: translateY(-2px); }
    .toggle-btn.sel-yes {
      background: var(--bubble-green);
      border-color: #15803d;
      color: #ffffff;
      box-shadow: 0 4px 0 #15803d;
    }
    .toggle-btn.sel-no {
      background: var(--bubble-orange);
      border-color: #c2410c;
      color: #ffffff;
      box-shadow: 0 4px 0 #c2410c;
    }

    .reference-stage {
      text-align: center;
      margin-bottom: 26px;
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid var(--card-border);
      background: #f8fafc;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    .reference-stage img, .reference-stage svg {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .chat-speaker-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .speaker-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card-border);
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .letter-dropdown {
      width: 64px;
      height: 56px;
      border: 3.5px solid var(--text-dark);
      border-radius: 16px;
      background: #ffffff;
      font-family: 'Fredoka', cursive;
      font-size: 26px;
      font-weight: 700;
      color: var(--bubble-orange);
      text-align: center;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
    }
    .letter-dropdown:focus {
      border-color: var(--bubble-cyan);
      box-shadow: 0 0 14px rgba(0, 196, 204, 0.6);
    }

    .input-reading {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 8px 18px;
      border: 3.5px solid var(--card-border);
      border-radius: 16px;
      outline: none;
      color: #0b5cab;
      background: #f8fbfe;
      transition: all 0.2s;
    }
    .input-reading:focus {
      border-color: var(--bubble-cyan);
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(0, 196, 204, 0.25);
    }

    .title-choice-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      border-radius: 20px;
      border: 3.5px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      transition: all 0.15s ease;
      color: var(--text-dark);
      margin-bottom: 12px;
    }
    .title-choice-card:hover {
      border-color: var(--bubble-cyan);
      transform: translateY(-2px);
    }
    .title-choice-card.selected {
      background: #f0fdf4;
      border-color: var(--bubble-green);
      color: #15803d;
      box-shadow: 0 5px 0 #15803d;
      transform: scale(1.01);
    }
    .title-choice-card input[type="radio"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #15803d;
    }

    .story-reading-box {
      font-size: 22px;
      line-height: 2.1;
      color: #1e293b;
      font-weight: 600;
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 34px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
      margin-bottom: 28px;
    }

    .cloze-dropdown {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 700;
      color: var(--bubble-blue);
      background: #f8fbff;
      border: 3px solid var(--bubble-blue);
      border-radius: 14px;
      padding: 4px 14px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--bubble-blue);
      margin: 0 4px;
    }
    .cloze-dropdown:focus { border-color: var(--bubble-orange); box-shadow: 0 3px 0 #c2410c; }

    .feedback-panel-card {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 28px;
      padding: 28px 32px;
      max-width: 960px;
      margin: 28px auto 0 auto;
      text-align: left;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
    }
    .feedback-part-title {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      color: #0b5cab;
      border-bottom: 2.5px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .feedback-part-title:first-child { margin-top: 0; }
    .feedback-item-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      font-size: 18px;
      line-height: 1.45;
    }
    .fb-tag {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .fb-correct { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
    .fb-wrong { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

    .bottom-bar {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      flex-wrap: wrap;
    }
    .btn-act {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 18px 42px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-next {
      background: linear-gradient(180deg, #2fd277 0%, #15b35c 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #0d8a44, 0 12px 24px rgba(21, 179, 92, 0.4);
    }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #0d8a44; }

    .btn-finish-all {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #075985, 0 12px 24px rgba(2, 132, 199, 0.4);
    }
    .btn-finish-all:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #075985; }

    .btn-prev {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      color: #64748b;
      box-shadow: 0 6px 0 #94a3b8;
    }

    @media (max-width: 980px) {
      .top-nav { padding: 0 20px; }
      .exam-card { padding: 24px; }
      .qa-row { flex-direction: column; align-items: flex-start; }
      .interactive-line-slot { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="glowing-aura aura-cyan"></div>
  <div class="glowing-aura aura-yellow"></div>
  <div class="glowing-aura aura-purple"></div>

  <header class="top-nav">
    <a href="index.html" class="btn-back-home">⬅ Exit to Map</a>
    <div class="exam-tag"><span>📖</span> Mock 05 • Reading & Writing</div>
    <div class="timer-badge">
      <span>⏰</span> <span id="timerTxt">45:00</span>
      <span style="font-size:14px; color:#78350f; font-weight:700;">(Practice Mode)</span>
    </div>
  </header>

  <main class="main-wrap">
    <div class="exam-card" id="examMount"></div>
  </main>

  <script>
    let currentPart = 1;
    let selectedWordP1 = null;

    const userAnswers = {
      p1: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "", q8: "", q9: "", q10: "" },
      p2: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "" },
      p3: { q1: "", q2: "", q3: "", q4: "", q5: "" },
      p4: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "" },
      p5: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "" },
      p6: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "", q8: "", q9: "", q10: "" },
      p7: { q1: "", q2: "", q3: "", q4: "", q5: "" }
    };

    // Official Cambridge Flyers Mock 05 Answer Key
    const answerKey = {
      p1: {
        q1: ["bats"],
        q2: ["a watermelon"],
        q3: ["queens"],
        q4: ["dinosaurs"],
        q5: ["artists"],
        q6: ["soup"],
        q7: ["jam"],
        q8: ["dolphins"],
        q9: ["a journalist"],
        q10: ["camels"]
      },
      p2: {
        q1: "yes",
        q2: "no",
        q3: "yes",
        q4: "yes",
        q5: "no",
        q6: "yes",
        q7: "yes"
      },
      p3: {
        q1: "F",
        q2: "B",
        q3: "G",
        q4: "A",
        q5: "C"
      },
      p4: {
        q1: ["ice"],
        q2: ["broke"],
        q3: ["hospital"],
        q4: ["warm"],
        q5: ["thanked"],
        q6: "Chocolate helps his friend"
      },
      p5: {
        q1: ["wash", "to wash"],
        q2: ["older sister", "big sister", "sister"],
        q3: ["doing her homework", "doing homework"],
        q4: ["3", "three", "out 3", "out three"],
        q5: ["email", "email some of", "to email"],
        q6: ["horrible", "a horrible one", "horrible one"],
        q7: ["ice cream", "ice creams", "ice cream from their mum", "ice cream from their mother", "some ice cream"]
      },
      p6: {
        q1: "get",
        q2: "it",
        q3: "don't",
        q4: "go",
        q5: "like",
        q6: "all",
        q7: "us",
        q8: "these",
        q9: "when",
        q10: "hit"
      },
      p7: {
        q1: ["than"],
        q2: ["which", "that"],
        q3: ["was"],
        q4: ["made", "full", "built"],
        q5: ["love", "like", "hate", "want"]
      }
    };

    function cleanInput(str) {
      return (str || "")
        .toLowerCase()
        .replace(/[’‘`]/g, "'")
        .replace(/[^\w\s']/g, "")
        .trim();
    }

    function tryMultipleBases(imgEl, baseNames, currentBaseIdx = 0, currentExtIdx = 0) {
      const exts = ['.jpg', '.png', '.jpeg', '.webp', '.svg'];
      if (currentBaseIdx < baseNames.length) {
        if (currentExtIdx < exts.length) {
          imgEl.onerror = () => tryMultipleBases(imgEl, baseNames, currentBaseIdx, currentExtIdx + 1);
          imgEl.src = baseNames[currentBaseIdx] + exts[currentExtIdx];
        } else {
          tryMultipleBases(imgEl, baseNames, currentBaseIdx + 1, 0);
        }
      } else {
        imgEl.style.display = 'none';
      }
    }

    let secondsLeft = 45 * 60;
    const timerInterval = setInterval(() => {
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        alert("⏰ Practice Time is up! Reviewing your scores now...");
        finishExam();
        return;
      }
      secondsLeft--;
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      const timerEl = document.getElementById('timerTxt');
      if (timerEl) timerEl.textContent = `${m}:${s}`;
    }, 1000);

    function nextPart(step) { currentPart = step; renderScreen(); }
    function prevPart(step) { currentPart = step; renderScreen(); }

    function renderScreen() {
      const mount = document.getElementById('examMount');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (currentPart === 1) renderPart1(mount);
      else if (currentPart === 2) renderPart2(mount);
      else if (currentPart === 3) renderPart3(mount);
      else if (currentPart === 4) renderPart4(mount);
      else if (currentPart === 5) renderPart5(mount);
      else if (currentPart === 6) renderPart6(mount);
      else if (currentPart === 7) renderPart7(mount);
      else if (currentPart === 8) renderResults(mount);
    }

    // ==========================================
    // PART 1: DEFINITIONS (10 Questions)
    // ==========================================
    function renderPart1(mount) {
      const words = [
        "swans", "queens", "dinosaurs", "a journalist", "camels",
        "soup", "jam", "bats", "kangaroos", "artists",
        "flour", "a watermelon", "dolphins", "a farmer"
      ];

      const questions = [
        { id: "q1", text: "These animals can live in caves, in trees and sometimes in our houses! In some places, you see them flying and looking for food in the evening." },
        { id: "q2", text: "This is a kind of big, round fruit which is dark green outside and red or pink inside." },
        { id: "q3", text: "These are very rich women who are very important. Some of them live in castles" },
        { id: "q4", text: "These animals lived a long time ago. They don't live now." },
        { id: "q5", text: "These people draw and paint pictures to sell." },
        { id: "q6", text: "You eat this from a bowl with a spoon or drink it from a big cup. You can make it with vegetables and meat." },
        { id: "q7", text: "This is made with fruit and sugar." },
        { id: "q8", text: "These animals live in water. People enjoy watching them swim, jump and do clever things." },
        { id: "q9", text: "This person looks for news stories and then writes them for us to read." },
        { id: "q10", text: "These animals can carry a lot of heavy things and can walk for a long time in hot weather without any water." }
      ];

      let bankHtml = words.map(w => {
        const isUsed = Object.values(userAnswers.p1).includes(w);
        const isSel = selectedWordP1 === w;
        return `<button class="word-pill ${isUsed ? 'used' : ''} ${isSel ? 'selected' : ''}" onclick="pickWordP1('${w}')">${w}</button>`;
      }).join('');

      let listHtml = questions.map((q, idx) => {
        const val = userAnswers.p1[q.id] || "Choose word";
        const isFilled = val !== "Choose word";
        return `
          <div class="qa-row">
            <div class="qa-text"><b>${idx + 1}.</b> ${q.text}</div>
            <div class="interactive-line-slot ${isFilled ? 'filled' : ''}" onclick="placeWordP1('${q.id}')">${val}</div>
          </div>
        `;
      }).join('');

      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>📚</span> Part 1 — Definitions & Vocabulary</h2>
        </div>

          Some kinds of goats look (5) ${getDropdownP6('q5')} sheep. There are goats with short legs and goats with longer legs. (6) ${getDropdownP6('q6')} goats have beards. Some have a lot of long hair and other goats don't. Some kinds of goats, for example 'Mohair' and 'Cashmere' goats, give (7) ${getDropdownP6('q7')} beautiful soft wool. People use it to make sweaters, scarves and other clothes. (8) ${getDropdownP6('q8')} clothes are very warm, but are often expensive if you buy them from a shop.<br><br>
          Goats can be dangerous. (9) ${getDropdownP6('q9')} they are unhappy, they sometimes use their very hard heads to (10) ${getDropdownP6('q10')} other goats and sometimes people.
        </div>
        <div class="bottom-bar">
          <button class="btn-act btn-prev" onclick="savePart6(); prevPart(5);">⬅ Back</button>
          <button class="btn-act btn-next" onclick="savePart6(); nextPart(7);">Continue to Part 7 ➔</button>
        </div>
      `;
    }

    function savePart6() {
      for (let i = 1; i <= 10; i++) {
        const el = document.getElementById(`p6_q${i}`);
        if (el) userAnswers.p6[`q${i}`] = el.value;
      }
    }

    // ==========================================
    // PART 7: OPEN CLOZE DIARY (5 Questions)
    // ==========================================
    function renderPart7(mount) {
      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>🤖</span> Part 7 — Open Cloze: Science Museum</h2>
        </div>
        <div class="instructions-box">
          Read the diary and write the missing words. <b>Write one word on each line.</b>
        </div>
        <div class="reference-stage" style="max-width:540px; margin:0 auto 24px auto;">
          <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=crop&w=1200&q=80" alt="Family looking at modern humanoid robots in a science museum" onerror="tryMultipleBases(this, ['mock05-part7-scene', 'part7-scene'], 0, 0)">
        </div>
        <div class="story-reading-box" style="font-family:'Quicksand',sans-serif; border-left:14px solid var(--bubble-blue); max-width:880px; margin:0 auto;">
          <h3 style="font-family:'Fredoka'; color:#0b5cab; font-size:26px; margin-bottom:14px;">Saturday April 20</h3>
          It rained again this morning, so we went <span style="text-decoration:underline; font-weight:800; color:#15803d;">to</span> <i>(example)</i> the Science Museum. We saw more (1) <input type="text" class="input-reading" id="p7_q1" value="${userAnswers.p7.q1}" style="width:130px;"> twenty different kinds of robots.<br><br>
          We saw a robot (2) <input type="text" class="input-reading" id="p7_q2" value="${userAnswers.p7.q2}" style="width:130px;"> could clean your house. There (3) <input type="text" class="input-reading" id="p7_q3" value="${userAnswers.p7.q3}" style="width:130px;"> also a room with big pictures of planets and stars in it.<br><br>
          The museum had a cinema, too, and we watched a film about a house of the future. The house was (4) <input type="text" class="input-reading" id="p7_q4" value="${userAnswers.p7.q4}" style="width:130px;"> of glass and metal, and was under the ground. I'd (5) <input type="text" class="input-reading" id="p7_q5" value="${userAnswers.p7.q5}" style="width:130px;"> to live in a house like that.
        </div>
        <div class="bottom-bar">
          <button class="btn-act btn-prev" onclick="savePart7(); prevPart(6);">⬅ Back</button>
          <button class="btn-act btn-next" onclick="savePart7(); finishExam();">Finish Exam ➔</button>
        </div>
      `;
    }

    function savePart7() {
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById(`p7_q${i}`);
        if (el) userAnswers.p7[`q${i}`] = el.value.trim();
      }
    }

    // ==========================================
    // SCORE CALCULATION & DETAILED FEEDBACK
    // ==========================================
    function finishExam() {
      savePart7();
      currentPart = 8;
      renderScreen();
    }

    function renderResults(mount) {
      clearInterval(timerInterval);

      let totalScore = 0;
      let fb = { p1: [], p2: [], p3: [], p4: [], p5: [], p6: [], p7: [] };

      // Part 1 (10 marks)
      for (let k in answerKey.p1) {
        const u = cleanInput(userAnswers.p1[k]);
        const isOk = answerKey.p1[k].includes(u);
        if (isOk) totalScore++;
        fb.p1.push({ q: k.toUpperCase(), user: userAnswers.p1[k] || "(empty)", correct: answerKey.p1[k][0], ok: isOk });
      }

      // Part 2 (7 marks)
      for (let k in answerKey.p2) {
        const u = (userAnswers.p2[k] || "").toLowerCase();
        const isOk = u === answerKey.p2[k];
        if (isOk) totalScore++;
        fb.p2.push({ q: k.toUpperCase(), user: userAnswers.p2[k] || "(empty)", correct: answerKey.p2[k], ok: isOk });
      }

      // Part 3 (5 marks)
      for (let k in answerKey.p3) {
        const u = (userAnswers.p3[k] || "").toUpperCase();
        const isOk = u === answerKey.p3[k];
        if (isOk) totalScore++;
        fb.p3.push({ q: k.toUpperCase(), user: userAnswers.p3[k] || "(empty)", correct: answerKey.p3[k], ok: isOk });
      }

      // Part 4 (6 marks: 5 cloze + 1 title)
      for (let k of ["q1","q2","q3","q4","q5"]) {
        const u = cleanInput(userAnswers.p4[k]);
        const isOk = answerKey.p4[k].includes(u);
        if (isOk) totalScore++;
        fb.p4.push({ q: k.toUpperCase(), user: userAnswers.p4[k] || "(empty)", correct: answerKey.p4[k][0], ok: isOk });
      }
      const titleOk = userAnswers.p4.q6 === answerKey.p4.q6;
      if (titleOk) totalScore++;
      fb.p4.push({ q: "Q6 (TITLE)", user: userAnswers.p4.q6 || "(empty)", correct: answerKey.p4.q6, ok: titleOk });

      // Part 5 (7 marks)
      for (let k in answerKey.p5) {
        const u = cleanInput(userAnswers.p5[k]);
        const isOk = answerKey.p5[k].some(ans => cleanInput(ans) === u);
        if (isOk) totalScore++;
        fb.p5.push({ q: k.toUpperCase(), user: userAnswers.p5[k] || "(empty)", correct: answerKey.p5[k][0], ok: isOk });
      }

      // Part 6 (10 marks)
      for (let k in answerKey.p6) {
        const u = cleanInput(userAnswers.p6[k]);
        const isOk = answerKey.p6[k];
        if (u === isOk) totalScore++;
        fb.p6.push({ q: k.toUpperCase(), user: userAnswers.p6[k] || "(empty)", correct: answerKey.p6[k], ok: u === isOk });
      }

      // Part 7 (5 marks)
      for (let k in answerKey.p7) {
        const u = cleanInput(userAnswers.p7[k]);
        const isOk = answerKey.p7[k].includes(u);
        if (isOk) totalScore++;
        fb.p7.push({ q: k.toUpperCase(), user: userAnswers.p7[k] || "(empty)", correct: answerKey.p7[k].join(' / '), ok: isOk });
      }

      let shields = 1;
      if (totalScore >= 40) shields = 5;
      else if (totalScore >= 32) shields = 4;
      else if (totalScore >= 24) shields = 3;
      else if (totalScore >= 16) shields = 2;

      function renderFbSection(title, list) {
        return `
          <div class="feedback-part-title">${title}</div>
          ${list.map(item => `
            <div class="feedback-item-row">
              <span class="fb-tag ${item.ok ? 'fb-correct' : 'fb-wrong'}">${item.ok ? 'CORRECT' : 'REVIEW'}</span>
              <div>
                <b>${item.q}:</b> Your answer: <i>"${item.user}"</i> 
                ${!item.ok ? `➔ Correct: <b style="color:#0b5cab;">${item.correct}</b>` : ''}
              </div>
            </div>
          `).join('')}
        `;
      }

      mount.innerHTML = `
        <div style="text-align:center; margin-bottom:30px;">
          <h2 style="font-family:'Fredoka'; font-size:42px; color:#0b5cab;">A2 Flyers Mock Test 5 Completed! 🎉</h2>
          <p style="color:var(--text-sub); font-size:22px; font-weight:700; margin-top:8px;">Reading & Writing Component</p>
          <div style="font-size:44px; margin:20px 0;">
            ${"🛡️".repeat(shields)} ${"⚪".repeat(5 - shields)}
          </div>
          <div style="font-family:'Fredoka'; font-size:32px; color:#15803d;">
            Score: ${totalScore} / 44 (${Math.round((totalScore/44)*100)}%) • ${shields} Shields
          </div>
        </div>

        <div class="feedback-panel-card">
          <h3 style="font-family:'Fredoka'; color:#0b5cab; font-size:28px; margin-bottom:16px;">Detailed Pedagogical Feedback</h3>
          ${renderFbSection("Part 1 — Definitions & Vocabulary", fb.p1)}
          ${renderFbSection("Part 2 — Picture Verification (yes / no)", fb.p2)}
          ${renderFbSection("Part 3 — Dialogue Matching (A–H)", fb.p3)}
          ${renderFbSection("Part 4 — Story Cloze & Title", fb.p4)}
          ${renderFbSection("Part 5 — Daisy and the Funny Drink", fb.p5)}
          ${renderFbSection("Part 6 — Goats (Grammar Cloze)", fb.p6)}
          ${renderFbSection("Part 7 — Open Cloze: Science Museum", fb.p7)}
        </div>

        <div class="bottom-bar" style="justify-content:center; gap:20px;">
          <button class="btn-act btn-prev" onclick="location.reload()">🔄 Try Mock Again</button>
          <a href="index.html" class="btn-act btn-finish-all">Complete & Return to Map 🗺️</a>
        </div>
      `;
    }

    renderScreen();
  </script>
