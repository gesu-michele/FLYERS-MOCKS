<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambridge A2 Flyers Adventure - Dr. Jesús Miguel Lima E. | JM ELT Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    @font-face {
      font-family: 'AnanthaSignature';
      src: url('Anantha%20Signature%20For%20Personal%20Use.ttf') format('truetype'),
           url('Anantha Signature For Personal Use.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg-sky: #dcf2ff;
      --bubble-cyan: #00c4cc;
      --bubble-blue: #2575fc;
      --bubble-yellow: #ffb800;
      --bubble-orange: #ff5722;
      --bubble-green: #00d084;
      --bubble-purple: #7928ca;
      --text-dark: #1e1e4b;
      --text-sub: #5c6280;
      --white: #ffffff;
      --card-border: #bfe3ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #c3e7ff 0%, #e3f3ff 45%, #fff6e5 100%);
      color: var(--text-dark);
      min-height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* EFECTOS DE FONDO FLOTANTE */
    .bg-glow-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }
    .orb-1 { width: 450px; height: 450px; background: rgba(0, 196, 204, 0.25); top: -80px; left: -80px; }
    .orb-2 { width: 500px; height: 500px; background: rgba(255, 184, 0, 0.22); bottom: 10px; right: -100px; animation-delay: -3s; }
    .orb-3 { width: 350px; height: 350px; background: rgba(121, 40, 202, 0.18); top: 35%; right: 25%; animation-delay: -5s; }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
      50% { transform: scale(1.15) translate(20px, 15px); opacity: 0.9; }
      100% { transform: scale(0.95) translate(-15px, -10px); opacity: 0.6; }
    }

    .cloud-particle {
      position: fixed;
      background: rgba(255, 255, 255, 0.65);
      border-radius: 100px;
      pointer-events: none;
      z-index: 0;
      animation: floatCloud 24s linear infinite;
    }
    .cp-1 { width: 180px; height: 50px; top: 18%; left: -200px; }
    .cp-2 { width: 240px; height: 65px; top: 52%; left: -260px; animation-duration: 34s; animation-delay: -10s; }
    .cp-3 { width: 140px; height: 40px; top: 78%; left: -160px; animation-duration: 20s; animation-delay: -4s; }

    @keyframes floatCloud {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(100vw + 320px)); }
    }

    #app-viewport {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 1;
    }

    /* TOP NAVIGATION */
    .top-nav {
      height: 72px;
      background: rgba(255, 255, 255, 0.92);
      border-bottom: 4px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      box-shadow: 0 6px 16px rgba(37, 117, 252, 0.08);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    .nav-brand-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .flyers-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(135deg, #ff7a00, #ff0055);
      color: white;
      padding: 8px 18px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 16px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(255, 0, 85, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .nav-title {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 600;
      color: #2b5c92;
      background: #e1f2ff;
      padding: 6px 14px;
      border-radius: 20px;
    }

    .nav-brand-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .shield-display {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff3cc;
      border: 3.5px solid #ffcc00;
      padding: 6px 16px;
      border-radius: 999px;
      font-family: 'Fredoka', cursive;
      font-size: 16px;
      font-weight: 700;
      color: #b37400;
      box-shadow: 0 4px 0 #e6b800;
    }

    .progress-track {
      font-family: 'Fredoka', cursive;
      font-size: 14px;
      font-weight: 600;
      color: #0084ff;
      background: #e8f4ff;
      border: 2px solid #b8dcff;
      padding: 6px 16px;
      border-radius: 999px;
    }

    .company-logo-slot {
      height: 42px;
      max-width: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .company-logo-slot img {
      max-height: 100%;
      max-width: 100%;
      object-fit: contain;
    }

    .screen-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .slide {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: space-between;
      width: 100%;
    }

    /* PANTALLA 1: PORTADA PRINCIPAL */
    .cover-fullscreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 30px 60px 0 60px;
      max-width: 1380px;
      width: 100%;
      margin: 0 auto;
    }

    .cover-top-badge-row {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .hero-content-flex {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
      margin-top: 24px;
    }

    .hero-text-side {
      flex: 1;
      max-width: 820px;
    }

    .adventure-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background: linear-gradient(135deg, #00d084, #009e60);
      padding: 6px 18px;
      border-radius: 999px;
      box-shadow: 0 4px 12px rgba(0, 208, 132, 0.35);
    }

    .main-task-title {
      font-family: 'Fredoka', cursive;
      font-size: clamp(40px, 5.4vw, 76px);
      font-weight: 700;
      line-height: 1.1;
      color: #0b5cab;
      text-shadow: 3px 3px 0px #ffffff, 6px 6px 0px #c5e4ff;
      margin-top: 12px;
      margin-bottom: 14px;
    }

    .main-task-title span {
      color: #ff5722;
      display: inline-block;
    }

    .welcome-text-block {
      background: rgba(255, 255, 255, 0.96);
      border: 4px solid var(--card-border);
      border-radius: 26px;
      padding: 22px 28px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 14px 28px rgba(37, 117, 252, 0.12);
    }

    .welcome-en {
      font-size: clamp(16px, 1.25vw, 19px);
      color: #1e293b;
      line-height: 1.5;
      font-weight: 700;
    }

    .welcome-en strong {
      color: #0070ba;
      background: #eef7ff;
      padding: 2px 8px;
      border-radius: 8px;
    }

    .welcome-es {
      font-size: clamp(14px, 1.05vw, 16px);
      color: #64748b;
      line-height: 1.45;
      font-weight: 600;
    }

    .hero-stats-row {
      display: flex;
      gap: 16px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: #ffffff;
      border: 3px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 18px;
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 600;
      color: #0b5cab;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 10px rgba(37, 117, 252, 0.06);
    }

    .hero-mascot-side {
      flex-shrink: 0;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .yle-mascot-img {
      width: clamp(230px, 24vw, 340px);
      height: auto;
      filter: drop-shadow(0 16px 24px rgba(11, 92, 171, 0.22));
      animation: wavingMonkey 3s ease-in-out infinite;
      transform-origin: bottom center;
    }

    @keyframes wavingMonkey {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-3.5deg) translateY(-8px); }
      75% { transform: rotate(3.5deg) translateY(-4px); }
    }

    /* PIE DE PÁGINA */
    .cover-bottom-row {
      margin-top: auto;
      border-top: 4px dashed var(--card-border);
      padding: 22px 0 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: nowrap;
      gap: 24px;
      width: 100%;
    }

    .signature-container {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }

    .signature-name-wrapper {
      margin-bottom: 2px;
    }

    .signature-name {
      font-family: 'AnanthaSignature', cursive, sans-serif;
      font-size: clamp(34px, 3.2vw, 50px);
      color: #0b5cab;
      line-height: 1.2;
      display: inline-block;
    }

    .signature-roles {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .signature-roles span {
      font-size: 12.5px;
      font-weight: 700;
      color: #475569;
    }

    .signature-roles span.role-highlight {
      color: #ff5722;
      font-weight: 800;
    }

    .cover-action-wrapper {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-shrink: 0;
      gap: 16px;
      flex-wrap: wrap;
    }

    .btn-fun {
      font-family: 'Fredoka', cursive;
      font-size: 18px;
      font-weight: 600;
      padding: 15px 36px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn-launch-large {
      background: linear-gradient(180deg, #2fd277 0%, #15b35c 100%);
      color: #ffffff;
      box-shadow: 0 6px 0 #0d8a44, 0 10px 18px rgba(21, 179, 92, 0.4);
    }

    .btn-launch-large:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0d8a44, 0 14px 22px rgba(21, 179, 92, 0.5);
    }

    .btn-launch-large:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0d8a44;
    }

    .btn-fast-mock {
      background: linear-gradient(180deg, #ffbb00 0%, #ff9900 100%);
      color: #523100;
      box-shadow: 0 6px 0 #cc7a00, 0 10px 18px rgba(255, 153, 0, 0.35);
    }

    .btn-fast-mock:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #cc7a00, 0 14px 22px rgba(255, 153, 0, 0.45);
    }

    .btn-fast-mock:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #cc7a00;
    }

    /* PANTALLAS 2 Y 3 */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px 20px;
      flex: 1;
      max-width: 1040px;
      width: 100%;
      margin: 0 auto;
    }

    .center-tag {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      background: #7928ca;
      padding: 6px 18px;
      border-radius: 999px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(121, 40, 202, 0.3);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .center-title {
      font-family: 'Fredoka', cursive;
      font-size: clamp(30px, 3.4vw, 42px);
      color: #0b5cab;
      margin-bottom: 8px;
      text-shadow: 2px 2px 0px #ffffff;
    }

    .fun-card {
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 32px;
      padding: 32px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 14px 28px rgba(37, 117, 252, 0.12);
      text-align: left;
      margin-top: 16px;
      position: relative;
    }

    .field-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 18px;
    }

    .field-group label {
      font-family: 'Fredoka', cursive;
      font-size: 16px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .field-input {
      background: #f4faff;
      border: 3px solid var(--card-border);
      border-radius: 18px;
      padding: 15px 20px;
      font-family: 'Quicksand', sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: #0b5cab;
      outline: none;
      transition: all 0.2s;
    }

    .field-input:focus {
      border-color: #00c4cc;
      background: #ffffff;
      box-shadow: 0 0 0 6px rgba(0, 196, 204, 0.2);
    }

    .companion-bubble-box {
      background: linear-gradient(135deg, #fff9e6, #fffdf2);
      border: 3px dashed #ffcc00;
      border-radius: 24px;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 18px;
    }

    .companion-mascot-slot {
      flex-shrink: 0;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .companion-mascot-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      animation: float 2.2s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .companion-text {
      font-size: 15px;
      color: #7a5000;
      font-weight: 700;
      line-height: 1.45;
    }

    .companion-text strong {
      color: #ff5722;
    }

    /* MAPA CON TARJETAS CLARAS Y DIRECTAS */
    .progress-summary-card {
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 32px;
      padding: 24px;
      width: 100%;
      max-width: 1020px;
      box-shadow: 0 14px 30px rgba(37, 117, 252, 0.12);
      text-align: left;
      margin: 16px 0;
      max-height: 520px;
      overflow-y: auto;
    }

    .mock-block {
      background: #f8fbff;
      border: 3.5px solid #ffaa00;
      border-radius: 24px;
      padding: 20px 22px;
      margin-bottom: 18px;
      transition: all 0.2s ease;
      box-shadow: 0 6px 14px rgba(255, 170, 0, 0.12);
    }

    .mock-block:hover {
      border-color: #00c4cc;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(0, 196, 204, 0.18);
    }

    .mock-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .mock-title {
      font-family: 'Fredoka', cursive;
      font-size: 1.35rem;
      color: #0b5cab;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mock-score-pill {
      font-family: 'Fredoka', cursive;
      font-size: 14px;
      color: #ffffff;
      background: #ff7a00;
      padding: 4px 12px;
      border-radius: 999px;
      box-shadow: 0 3px 0 #cc5f00;
    }

    .mock-badge-status {
      font-family: 'Fredoka', cursive;
      font-size: 13px;
      padding: 6px 14px;
      border-radius: 999px;
    }

    .badge-ready { background: #d7fae3; color: #0d8a44; border: 2px solid #8fe7ae; }
    .badge-done { background: #ffdfec; color: #d61f69; border: 2px solid #f9a8d4; }

    /* GRID ADAPTADO A 2 SECCIONES */
    .mock-sections-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .section-chip-btn {
      background: #ffffff;
      border: 3px solid var(--card-border);
      border-radius: 18px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      color: #0b5cab;
      font-family: 'Fredoka', cursive;
      font-size: 1.05rem;
      transition: all 0.15s ease;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--card-border);
    }

    .section-chip-btn:hover {
      border-color: #2575fc;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #2575fc;
      background: #f0f7ff;
    }

    .section-chip-btn span.chip-tag {
      font-family: 'Quicksand', sans-serif;
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      display: block;
      margin-top: 3px;
    }

    .bottom-bar {
      padding: 16px 40px;
      background: rgba(255, 255, 255, 0.95);
      border-top: 4px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .btn-outline {
      background: #ffffff;
      border: 3px solid #cbd5e1;
      color: #64748b;
      box-shadow: 0 5px 0 #94a3b8;
    }

    .btn-outline:hover {
      background: #f8fafc;
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #94a3b8;
    }

    .btn-outline:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 #94a3b8;
    }

    .institutional-bottom {
      padding: 12px 36px;
      background: #ffffff;
      border-top: 2px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
    }

    .institutional-bottom strong {
      color: #0b5cab;
    }

    @media (max-width: 900px) {
      .hero-content-flex {
        flex-direction: column-reverse;
        text-align: center;
      }
      .hero-stats-row {
        justify-content: center;
      }
      .yle-mascot-img {
        width: 190px;
      }
      .cover-fullscreen { padding: 20px 20px 0 20px; }
      .top-nav { padding: 0 16px; }
      .bottom-bar { padding: 14px 20px; }
      .cover-bottom-row { flex-direction: column; align-items: flex-start; gap: 20px; }
      .signature-name { font-size: 34px; }
      .cover-action-wrapper { width: 100%; justify-content: flex-start; }
      .btn-fun { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- ELEMENTOS DE FONDO -->
  <div class="bg-glow-orb orb-1"></div>
  <div class="bg-glow-orb orb-2"></div>
  <div class="bg-glow-orb orb-3"></div>
  <div class="cloud-particle cp-1"></div>
  <div class="cloud-particle cp-2"></div>
  <div class="cloud-particle cp-3"></div>

  <div id="app-viewport">
    
    <!-- TOP NAVIGATION -->
    <div class="top-nav" id="topNav" style="display: none;">
      <div class="nav-brand-left">
        <div class="flyers-badge">
          <span>🚀</span> A2 FLYERS
        </div>
        <span class="nav-title">🎮 Cambridge Kids Exam Quest (01–30)</span>
      </div>

      <div class="nav-brand-right">
        <div class="shield-display">
          <span>🛡️</span> <span id="navShields">15</span> Shields
        </div>
        <div class="progress-track" id="navPageTrack">Player Profile</div>
        <div class="company-logo-slot">
          <img src="logo.png" alt="JM ELT Solutions" onerror="this.style.display='none'">
        </div>
      </div>
    </div>

    <!-- MAIN MOUNT CONTAINER -->
    <div class="screen-container" id="mountNode"></div>

    <!-- INSTITUTIONAL FOOTER -->
    <div class="institutional-bottom">
      <span>🌈 Cambridge YLE: A2 Flyers Interactive Mock Suite</span>
      <span>All Rights Reserved © by <strong>Dr. Jesús Miguel Lima E.</strong> • CEO of JM ELT Solutions</span>
    </div>

  </div>

  <script>
    const STORAGE_KEY = "flyers_mastery_user_profile";
    const MOCK_COMPLETION_KEY = "flyers_mocks_status_01_30";
    let activeScreen = 1;

    let userState = {
      name: "",
      birthYear: "",
      shields: 15
    };

    let mocksStatus = {};

    function initData() {
      // Todos los 30 mocks quedan desbloqueados de forma libre
      for (let m = 1; m <= 30; m++) {
        mocksStatus[m] = { 
          completed: false, 
          unlocked: true,
          listeningScore: null,
          readingWritingScore: null
        };
      }

      const rawUser = localStorage.getItem(STORAGE_KEY);
      if (rawUser) {
        try {
          userState = { ...userState, ...JSON.parse(rawUser) };
        } catch(e) {}
      }

      const rawMocks = localStorage.getItem(MOCK_COMPLETION_KEY);
      if (rawMocks) {
        try {
          const loaded = JSON.parse(rawMocks);
          for (let m = 1; m <= 30; m++) {
            if (loaded[m]) {
              mocksStatus[m].completed = loaded[m].completed || false;
              mocksStatus[m].listeningScore = loaded[m].listeningScore || null;
              mocksStatus[m].readingWritingScore = loaded[m].readingWritingScore || null;
            }
            // Asegura que siempre permanezca desbloqueado
            mocksStatus[m].unlocked = true;
          }
        } catch(e) {}
      }

      for (let m = 1; m <= 30; m++) {
        const padded = String(m).padStart(2, '0');
        const lScore = localStorage.getItem(`flyers_listening_score_${padded}`);
        if (lScore !== null) {
          mocksStatus[m].listeningScore = lScore;
        }
      }
    }

    function syncStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(userState));
      localStorage.setItem(MOCK_COMPLETION_KEY, JSON.stringify(mocksStatus));
      const elShields = document.getElementById('navShields');
      if (elShields) elShields.innerText = userState.shields || 15;
    }

    function setScreen(step) {
      activeScreen = step;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      const mount = document.getElementById('mountNode');
      const nav = document.getElementById('topNav');
      const track = document.getElementById('navPageTrack');
      mount.innerHTML = '';

      if (activeScreen === 1) {
        nav.style.display = 'none';
        renderScreen1(mount);
      } else if (activeScreen === 2) {
        nav.style.display = 'flex';
        track.innerText = 'Player Profile';
        renderScreen2(mount);
      } else if (activeScreen === 3) {
        nav.style.display = 'flex';
        track.innerText = 'Adventure Map (Mocks 01–30)';
        renderScreen3(mount);
      }
      syncStorage();
    }

    function renderScreen1(mount) {
      mount.innerHTML = `
        <div class="slide">
          <div class="cover-fullscreen">
            <div>
              <div class="cover-top-badge-row">
                <div class="flyers-badge">
                  <span>🌟</span> CAMBRIDGE ENGLISH: A2 FLYERS
                </div>
                <div class="adventure-tag"><span>🎈</span> FUN INTERACTIVE TEST ADVENTURE</div>
              </div>

              <div class="hero-content-flex">
                <div class="hero-text-side">
                  <div class="main-task-title">A2 Flyers <span>Mocks (01–30)</span></div>

                  <div class="welcome-text-block">
                    <p class="welcome-en">
                      Ready for the challenge? Complete the mission: <strong>🎧 Listening ➔ 📖 Reading & Writing</strong> and win all your Cambridge Shields!
                    </p>
                    <p class="welcome-es">
                      ¡Aprende jugando! Practica las secciones oficiales de Cambridge Flyers y supera cada nivel a tu propio ritmo.
                    </p>
                  </div>

                  <div class="hero-stats-row">
                    <div class="stat-pill"><span>🎯</span> 30 Full Mocks</div>
                    <div class="stat-pill"><span>🏆</span> 5 Shields per Test</div>
                    <div class="stat-pill"><span>🎧</span> Real Exam Audio</div>
                    <div class="stat-pill"><span>📖</span> Reading & Writing</div>
                  </div>
                </div>

                <div class="hero-mascot-side">
                  <img src="yle-monkey.png" alt="Cambridge YLE Monkey Mascot" class="yle-mascot-img" onerror="this.src='https://i.ibb.co/vzGgB1h/yle-monkey.png'">
                </div>
              </div>
            </div>

            <!-- PIE DE PÁGINA AUTÉNTICO AL FONDO -->
            <div class="cover-bottom-row">
              <div class="signature-container">
                <div class="signature-name-wrapper">
                  <span class="signature-name">by Dr. Jesús Miguel Lima E.</span>
                </div>
                <div class="signature-roles">
                  <span class="role-highlight">CEO of JM ELT Solutions</span>
                  <span>Cambridge Assessment Specialist</span>
                  <span>Exam & Teacher Trainer</span>
                  <span>University Professor</span>
                </div>
              </div>

              <div class="cover-action-wrapper">
                <button class="btn-fun btn-fast-mock" onclick="launchMock01Direct()">
                  <span>⚡</span> Quick Play Mock 01 ➔
                </button>
                <button class="btn-fun btn-launch-large" onclick="setScreen(2)">
                  <span>🎮</span> Let's Start! ➔
                </button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function launchMock01Direct() {
      if (userState.name && userState.name.trim().length > 0) {
        window.location.href = 'listening-mock01.html';
      } else {
        setScreen(2);
      }
    }

    function renderScreen2(mount) {
      mount.innerHTML = `
        <div class="slide">
          <div class="center-stage">
            <div class="center-tag"><span>⭐</span> STEP 1: PLAYER BADGE</div>
            <h2 class="center-title">What is your superhero name?</h2>
            <div style="max-width: 580px;">
              <p style="font-size:17px; color:#475569; font-weight:700;">Type your name to save your badges and shields!</p>
              <p style="font-size:15px; color:#64748b; font-weight:600; margin-top:4px;">(Escribe tu nombre para guardar tus estrellas automáticamente.)</p>
            </div>

            <div class="fun-card">
              <div class="field-group">
                <label for="txtName"><span>🦸‍♂️</span> Your First Name (Tu Nombre)</label>
                <input type="text" id="txtName" class="field-input" placeholder="e.g. Leo" value="${userState.name || ''}" autocomplete="off">
              </div>
              <div class="field-group">
                <label for="txtYear"><span>🎂</span> Birth Year or Age (Año o Edad)</label>
                <input type="number" id="txtYear" class="field-input" placeholder="e.g. 2014" min="2000" max="2026" value="${userState.birthYear || ''}">
              </div>

              <div class="companion-bubble-box">
                <div class="companion-mascot-slot">
                  <img src="yle-monkey-profile.png" alt="YLE Profile Mascot" class="companion-mascot-img" onerror="this.src='yle-monkey.png'">
                </div>
                <div class="companion-text">
                  ${userState.name 
                    ? `"Great to see you again, <strong>${userState.name}</strong>! Choose any mock you like from the mission map!"`
                    : `"Hi! I'm your exam buddy! Enter your name and let's start the adventure together!"`}
                </div>
              </div>
            </div>
          </div>

          <div class="bottom-bar">
            <button class="btn-fun btn-outline" onclick="setScreen(1)">
              <span>⬅</span> Home
            </button>
            <button class="btn-fun btn-launch-large" onclick="confirmProfile()">
              <span>🚀</span> Go to Tests ➔
            </button>
          </div>
        </div>
      `;
    }

    function confirmProfile() {
      const name = document.getElementById('txtName').value.trim();
      const year = document.getElementById('txtYear').value.trim();

      if (!name) {
        alert("Please write your name! 😊");
        return;
      }

      userState.name = name;
      userState.birthYear = year;
      syncStorage();
      setScreen(3);
    }

    function renderScreen3(mount) {
      let mocksHtml = '';

      for (let i = 1; i <= 30; i++) {
        const padded = String(i).padStart(2, '0');
        const isCompleted = mocksStatus[i] && mocksStatus[i].completed;
        
        const scoreBadge = mocksStatus[i].listeningScore !== null 
          ? `<span class="mock-score-pill">🎧 ${mocksStatus[i].listeningScore}/25 pts</span>` 
          : '';

        let statusBadge = isCompleted
          ? `<span class="mock-badge-status badge-done">🏆 COMPLETED</span>`
          : `<span class="mock-badge-status badge-ready">🌟 UNLOCKED</span>`;

        mocksHtml += `
          <div class="mock-block">
            <div class="mock-header-row">
              <div class="mock-title">
                <span>🎯 Mission N° ${padded}</span>
                ${scoreBadge}
              </div>
              <div>${statusBadge}</div>
            </div>
            
            <div class="mock-sections-grid">
              <!-- SECCIÓN 1: LISTENING -->
              <a href="listening-mock${padded}.html" class="section-chip-btn">
                <div>
                  <div>🎧 1. Listening Test</div>
                  <span class="chip-tag">5 Parts • Audio & Colors</span>
                </div>
                <span>➔</span>
              </a>

              <!-- SECCIÓN 2: READING & WRITING -->
              <a href="reading-mock${padded}.html" class="section-chip-btn">
                <div>
                  <div>📖 2. Reading & Writing</div>
                  <span class="chip-tag">7 Parts • Words & Stories</span>
                </div>
                <span>➔</span>
              </a>
            </div>
          </div>
        `;
      }

      mount.innerHTML = `
        <div class="slide">
          <div class="center-stage">
            <div class="center-tag"><span>🗺️</span> STEP 2: MISSION MAP</div>
            
            <div style="display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; margin-bottom: 10px;">
              <img src="yle-monkey-map.png" alt="YLE Map Mascot" style="width: 90px; height: auto; filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));" onerror="this.src='yle-monkey.png'">
              <div>
                <h2 class="center-title" style="margin-bottom: 4px;">Pick your Challenge!</h2>
                <p style="font-size:17px; color:#1e293b; font-weight:700;">
                  Hero: <strong style="color:#ff5722;">${userState.name || 'Student'}</strong> • Select any mock test below:
                </p>
              </div>
            </div>

            <div class="progress-summary-card">
              ${mocksHtml}
            </div>
          </div>

          <div class="bottom-bar">
            <button class="btn-fun btn-outline" onclick="setScreen(2)">
              <span>⬅</span> Change Name
            </button>
            <button class="btn-fun btn-launch-large" onclick="window.location.href='listening-mock01.html'">
              <span>🚀</span> Start Mock 01 ➔
            </button>
          </div>
        </div>
      `;
    }

    initData();
    render();
  </script>
</body>
</html>
