<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Flyers Mock 06 - Reading & Writing | Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-sky: #dcf2ff;
      --bubble-cyan: #00c4cc;
      --bubble-blue: #0284c7;
      --bubble-yellow: #ffb800;
      --bubble-orange: #ff5722;
      --bubble-green: #00d084;
      --bubble-purple: #7928ca;
      --text-dark: #121829;
      --text-sub: #334155;
      --white: #ffffff;
      --card-border: #a5d8ff;
      --correct: #00d084;
      --wrong: #ff5722;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #b3e0ff 0%, #dbf0ff 40%, #fff2d6 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      font-size: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .glowing-aura {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 7s ease-in-out infinite alternate;
    }
    .aura-cyan { width: 550px; height: 550px; background: rgba(0, 196, 204, 0.4); top: -120px; left: -100px; }
    .aura-yellow { width: 620px; height: 620px; background: rgba(255, 184, 0, 0.35); bottom: -120px; right: -100px; animation-delay: -3.5s; }
    .aura-purple { width: 480px; height: 480px; background: rgba(121, 40, 202, 0.28); top: 35%; right: 25%; animation-delay: -5s; }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.65; }
      50% { transform: scale(1.22) translate(35px, 25px); opacity: 1; filter: blur(120px); }
      100% { transform: scale(0.92) translate(-25px, -18px); opacity: 0.65; }
    }

    .top-nav {
      height: 86px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn-back-home {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-radius: 999px;
      padding: 10px 24px;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-sub);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .btn-back-home:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #cbd5e1; }

    .exam-tag {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      color: #0b5cab;
      background: #e1f2ff;
      border: 3px solid #bfe3ff;
      padding: 10px 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-badge {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      color: #523100;
      background: #fff3cc;
      border: 3.5px solid #ffcc00;
      padding: 8px 24px;
      border-radius: 999px;
      box-shadow: 0 5px 0 #e6b800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-wrap {
      max-width: 1240px;
      width: 100%;
      margin: 30px auto 50px auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .exam-card {
      background: rgba(255, 255, 255, 0.98);
      border: 5px solid var(--card-border);
      border-radius: 40px;
      padding: 42px;
      box-shadow: 0 18px 40px rgba(37, 117, 252, 0.16);
      position: relative;
    }

    .part-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 20px;
    }

    .part-title {
      font-family: 'Fredoka', cursive;
      font-size: 32px;
      color: #0b5cab;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .instructions-box {
      background: #f0f8ff;
      border-left: 10px solid var(--bubble-cyan);
      border-radius: 0 24px 24px 0;
      padding: 20px 28px;
      font-size: 21px;
      color: #1e293b;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.55;
    }

    .pill-bank {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      background: #f8fbff;
      padding: 20px;
      border-radius: 28px;
      border: 3.5px dashed var(--card-border);
    }

    .word-pill {
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      background: #ffffff;
      border: 3.5px solid var(--bubble-blue);
      color: var(--bubble-blue);
      padding: 8px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--bubble-blue);
      transition: all 0.15s ease;
    }
    .word-pill:hover { transform: translateY(-2px); }
    .word-pill.selected {
      background: var(--bubble-orange);
      border-color: #d83d0f;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 87, 34, 0.7), 0 5px 0 #b32a00;
      transform: scale(1.08);
    }
    .word-pill.used {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .reading-content-box {
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(37, 117, 252, 0.06);
    }

    .qa-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 2px dashed #e2e8f0;
      font-weight: 700;
      font-size: 20px;
    }
    .qa-row:last-child { border-bottom: none; }
    .qa-text { flex: 1; line-height: 1.5; }

    .interactive-line-slot {
      min-width: 220px;
      padding: 10px 18px;
      border: 3px dashed var(--bubble-blue);
      border-radius: 16px;
      background: #f8fbff;
      text-align: center;
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      color: var(--bubble-blue);
      cursor: pointer;
      transition: all 0.2s;
    }
    .interactive-line-slot.filled {
      border: 3px solid var(--bubble-cyan);
      background: var(--bubble-cyan);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 196, 204, 0.35);
    }
    .interactive-line-slot.example-slot {
      border: 3px solid var(--bubble-green);
      background: #dcfce7;
      color: #15803d;
      cursor: default;
    }

    .toggle-btn-group {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }
    .toggle-btn {
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      padding: 8px 24px;
      border-radius: 999px;
      border: 3px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover { transform: translateY(-2px); }
    .toggle-btn.sel-yes {
      background: var(--bubble-green);
      border-color: #15803d;
      color: #ffffff;
      box-shadow: 0 4px 0 #15803d;
    }
    .toggle-btn.sel-no {
      background: var(--bubble-orange);
      border-color: #c2410c;
      color: #ffffff;
      box-shadow: 0 4px 0 #c2410c;
    }

    .reference-stage {
      text-align: center;
      margin-bottom: 26px;
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid var(--card-border);
      background: #f8fafc;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    .reference-stage img, .reference-stage svg {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .chat-speaker-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .speaker-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card-border);
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .letter-dropdown {
      width: 64px;
      height: 56px;
      border: 3.5px solid var(--text-dark);
      border-radius: 16px;
      background: #ffffff;
      font-family: 'Fredoka', cursive;
      font-size: 26px;
      font-weight: 700;
      color: var(--bubble-orange);
      text-align: center;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
    }
    .letter-dropdown:focus {
      border-color: var(--bubble-cyan);
      box-shadow: 0 0 14px rgba(0, 196, 204, 0.6);
    }

    .input-reading {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 8px 18px;
      border: 3.5px solid var(--card-border);
      border-radius: 16px;
      outline: none;
      color: #0b5cab;
      background: #f8fbfe;
      transition: all 0.2s;
    }
    .input-reading:focus {
      border-color: var(--bubble-cyan);
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(0, 196, 204, 0.25);
    }

    .title-choice-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      border-radius: 20px;
      border: 3.5px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      transition: all 0.15s ease;
      color: var(--text-dark);
      margin-bottom: 12px;
    }
    .title-choice-card:hover {
      border-color: var(--bubble-cyan);
      transform: translateY(-2px);
    }
    .title-choice-card.selected {
      background: #f0fdf4;
      border-color: var(--bubble-green);
      color: #15803d;
      box-shadow: 0 5px 0 #15803d;
      transform: scale(1.01);
    }
    .title-choice-card input[type="radio"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #15803d;
    }

    .story-reading-box {
      font-size: 22px;
      line-height: 2.1;
      color: #1e293b;
      font-weight: 600;
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 34px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
      margin-bottom: 28px;
    }

    .cloze-dropdown {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 700;
      color: var(--bubble-blue);
      background: #f8fbff;
      border: 3px solid var(--bubble-blue);
      border-radius: 14px;
      padding: 4px 14px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--bubble-blue);
      margin: 0 4px;
    }
    .cloze-dropdown:focus { border-color: var(--bubble-orange); box-shadow: 0 3px 0 #c2410c; }

    .feedback-panel-card {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 28px;
      padding: 28px 32px;
      max-width: 960px;
      margin: 28px auto 0 auto;
      text-align: left;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
    }
    .feedback-part-title {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      color: #0b5cab;
      border-bottom: 2.5px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .feedback-part-title:first-child { margin-top: 0; }
    .feedback-item-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      font-size: 18px;
      line-height: 1.45;
    }
    .fb-tag {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .fb-correct { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
    .fb-wrong { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

    .bottom-bar {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      flex-wrap: wrap;
    }
    .btn-act {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 18px 42px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-next {
      background: linear-gradient(180deg, #2fd277 0%, #15b35c 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #0d8a44, 0 12px 24px rgba(21, 179, 92, 0.4);
    }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #0d8a44; }

    .btn-finish-all {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #075985, 0 12px 24px rgba(2, 132, 199, 0.4);
    }
    .btn-finish-all:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #075985; }

    .btn-prev {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      color: #64748b;
      box-shadow: 0 6px 0 #94a3b8;
    }

    @media (max-width: 980px) {
      .top-nav { padding: 0 20px; }
      .exam-card { padding: 24px; }
      .qa-row { flex-direction: column; align-items: flex-start; }
      .interactive-line-slot { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="glowing-aura aura-cyan"></div>
  <div class="glowing-aura aura-yellow"></div>
  <div class="glowing-aura aura-purple"></div>

  <header class="top-nav">
    <a href="index.html" class="btn-back-home">⬅ Exit to Map</a>
    <div class="exam-tag"><span>📖</span> Mock 06 • Reading & Writing</div>
    <div class="timer-badge">
      <span>⏰</span> <span id="timerTxt">45:00</span>
      <span style="font-size:14px; color:#78350f; font-weight:700;">(Practice Mode)</span>
    </div>
  </header>

  <main class="main-wrap">
    <div class="exam-card" id="examMount"></div>
  </main>

  <script>
    let currentPart = 1;
    let selectedWordP1 = null;

    const userAnswers = {
      p1: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "", q8: "", q9: "", q10: "" },
      p2: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "" },
      p3: { q1: "", q2: "", q3: "", q4: "", q5: "" },
      p4: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "" },
      p5: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "" },
      p6: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "", q8: "", q9: "", q10: "" },
      p7: { q1: "", q2: "", q3: "", q4: "", q5: "" }
    };

    // Official Cambridge Flyers Mock 06 Answer Key
    const answerKey = {
      p1: {
        q1: ["planes"],
        q2: ["bridges"],
        q3: ["a footballer"],
        q4: ["a taxi"],
        q5: ["uniforms"],
        q6: ["a mechanic"],
        q7: ["a station"],
        q8: ["lorries"],
        q9: ["shorts"],
        q10: ["nurses"]
      },
      p2: {
        q1: "yes",
        q2: "yes",
        q3: "no",
        q4: "no",
        q5: "no",
        q6: "no",
        q7: "yes"
      },
      p3: {
        q1: "C",
        q2: "E",
        q3: "A",
        q4: "H",
        q5: "B"
      },
      p4: {
        q1: ["wake"],
        q2: ["clouds"],
        q3: ["upstairs"],
        q4: ["ski"],
        q5: ["snowmen"],
        q6: "No school for William"
      },
      p5: {
        q1: ["university", "the university"],
        q2: ["write letters"],
        q3: ["grandma", "grandmother"],
        q4: ["some food for dinner", "some food", "food", "food for dinner"],
        q5: ["the clock", "the time", "clock", "time"],
        q6: ["6", "six", "6 o'clock", "six o'clock", "6 pm", "six pm"],
        q7: ["some bread and jam", "bread and jam", "some bread & jam", "bread & jam"]
      },
      p6: {
        q1: "ago",
        q2: "like",
        q3: "their",
        q4: "usually",
        q5: "which",
        q6: "walk",
        q7: "these",
        q8: "but",
        q9: "of",
        q10: "will"
      },
      p7: {
        q1: ["got"],
        q2: ["to"],
        q3: ["games", "music", "songs", "cds"],
        q4: ["are", "'re"],
        q5: ["next", "this"]
      }
    };

    function cleanInput(str) {
      return (str || "")
        .toLowerCase()
        .replace(/[’‘`]/g, "'")
        .replace(/[^\w\s']/g, "")
        .trim();
    }

    function tryMultipleBases(imgEl, baseNames, currentBaseIdx = 0, currentExtIdx = 0) {
      const exts = ['.jpg', '.png', '.jpeg', '.webp', '.svg'];
      if (currentBaseIdx < baseNames.length) {
        if (currentExtIdx < exts.length) {
          imgEl.onerror = () => tryMultipleBases(imgEl, baseNames, currentBaseIdx, currentExtIdx + 1);
          imgEl.src = baseNames[currentBaseIdx] + exts[currentExtIdx];
        } else {
          tryMultipleBases(imgEl, baseNames, currentBaseIdx + 1, 0);
        }
      } else {
        imgEl.style.display = 'none';
      }
    }

    let secondsLeft = 45 * 60;
    const timerInterval = setInterval(() => {
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        alert("⏰ Practice Time is up! Reviewing your scores now...");
        finishExam();
        return;
      }
      secondsLeft--;
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      const timerEl = document.getElementById('timerTxt');
      if (timerEl) timerEl.textContent = `${m}:${s}`;
    }, 1000);

    function nextPart(step) { currentPart = step; renderScreen(); }
    function prevPart(step) { currentPart = step; renderScreen(); }

    function renderScreen() {
      const mount = document.getElementById('examMount');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (currentPart === 1) renderPart1(mount);
      else if (currentPart === 2) renderPart2(mount);
      else if (currentPart === 3) renderPart3(mount);
      else if (currentPart === 4) renderPart4(mount);
      else if (currentPart === 5) renderPart5(mount);
      else if (currentPart === 6) renderPart6(mount);
      else if (currentPart === 7) renderPart7(mount);
      else if (currentPart === 8) renderResults(mount);
    }

    // ==========================================
    // PART 1: DEFINITIONS (10 Questions)
    // ==========================================
    function renderPart1(mount) {
      const words = [
        "a mechanic", "a station", "pilots", "bridges", "nurses",
        "lorries", "shorts", "ambulances", "a taxi", "uniforms",
        "a street", "belts", "planes", "a footballer"
      ];

      const questions = [
        { id: "q1", text: "You enjoy going in these if you like flying. You can sometimes see them in the sky or at airports." },
        { id: "q2", text: "You often walk over these when you cross rivers or roads. Traffic can go over bigger ones." },
        { id: "q3", text: "This person plays a sport for his job. He must run fast and kick a ball." },
        { id: "q4", text: "If you want to go somewhere in your town but you don't have a car and there's no bus, you can go in this." },
        { id: "q5", text: "Some people have to wear these at work or at school so everyone looks the same." },
        { id: "q6", text: "If you have a problem with your car, this person can help you." },
        { id: "q7", text: "When people need to catch trains, they must go to this place." },
        { id: "q8", text: "People use these to take big or heavy things by road from factories to shops, for example." },
        { id: "q9", text: "Some people like to wear these if the weather is hot and sunny." },
        { id: "q10", text: "These people work in hospitals and they help people who are ill." }
      ];

      let bankHtml = words.map(w => {
        const isUsed = Object.values(userAnswers.p1).includes(w);
        const isSel = selectedWordP1 === w;
        return `<button class="word-pill ${isUsed ? 'used' : ''} ${isSel ? 'selected' : ''}" onclick="pickWordP1('${w}')">${w}</button>`;
      }).join('');

      let listHtml = questions.map((q, idx) => {
        const val = userAnswers.p1[q.id] || "Choose word";
        const isFilled = val !== "Choose word";
        return `
          <div class="qa-row">
            <div class="qa-text"><b>${idx + 1}.</b> ${q.text}</div>
            <div class="interactive-line-slot ${isFilled ? 'filled' : ''}" onclick="placeWordP1('${q.id}')">${val}</div>
          </div>
        `;
      }).join('');

      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>📚</span> Part 1 — Definitions & Vocabulary</h2>
        </div>

        <div class="reference-stage" style="max-width:680px; margin:0 auto 24px auto; border-radius:26px; border:4px solid #16a34a; box-shadow:0 12px 28px rgba(22, 163, 74, 0.25);">
          ${dinosaursSvg}
        </div>
        <div class="story-reading-box">
          <h3 style="font-family:'Fredoka'; color:#0b5cab; text-align:center; margin-bottom:18px; font-size:28px;">Dinosaurs</h3>
          Perhaps some of <span style="text-decoration:underline; color:#15803d; font-weight:700;">the</span> <i>(example)</i> most interesting animals that have ever lived on our planet were dinosaurs. They lived here about 100,000,000 years (1) ${getDropdownP6('q1')}. The first dinosaurs had short, fat legs and big heads and they looked (2) ${getDropdownP6('q2')} very big lizards. This kind of dinosaur often walked on two legs.<br><br>
          Later in history, dinosaurs' necks were longer and (3) ${getDropdownP6('q3')} bodies were very heavy so they couldn't stand on just two legs. They (4) ${getDropdownP6('q4')} lived in wet places. They had short teeth (5) ${getDropdownP6('q5')} they used to eat plants in the forests there.<br><br>
          Some dinosaurs were too heavy to (6) ${getDropdownP6('q6')} on the ground all the time. (7) ${getDropdownP6('q7')} animals often had to live by rivers so they could stand in water for part of the time.<br><br>
          Dinosaurs are extinct now (8) ${getDropdownP6('q8')} we can read about them in books and look at pictures (9) ${getDropdownP6('q9')} them. Perhaps, in a dark cave somewhere, someone (10) ${getDropdownP6('q10')} find a dinosaur's egg one day.<br><br>
          What do you think?
        </div>
        <div class="bottom-bar">
          <button class="btn-act btn-prev" onclick="savePart6(); prevPart(5);">⬅ Back</button>
          <button class="btn-act btn-next" onclick="savePart6(); nextPart(7);">Continue to Part 7 ➔</button>
        </div>
      `;
    }

    function savePart6() {
      for (let i = 1; i <= 10; i++) {
        const el = document.getElementById(`p6_q${i}`);
        if (el) userAnswers.p6[`q${i}`] = el.value;
      }
    }

    // ==========================================
    // PART 7: OPEN CLOZE LETTER (5 Questions)
    // ==========================================
    function renderPart7(mount) {
      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>✉️</span> Part 7 — Open Cloze: Letter to Aunt Sally</h2>
        </div>
        <div class="instructions-box">
          Read the letter and write the missing words. <b>Write one word on each line.</b>
        </div>
        <div class="reference-stage" style="max-width:540px; margin:0 auto 24px auto;">
          <img src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?auto=format&fit=crop&w=1200&q=80" alt="Girl listening to CD music in bedroom with headphones" onerror="tryMultipleBases(this, ['mock06-part7-scene', 'part7-scene'], 0, 0)">
        </div>
        <div class="story-reading-box" style="font-family:'Quicksand',sans-serif; border-left:14px solid var(--bubble-blue); max-width:880px; margin:0 auto;">
          <p style="margin-bottom:12px;">Dear Aunt Sally,</p>
          <p style="margin-bottom:16px;">
            Thank <span style="text-decoration:underline; font-weight:800; color:#15803d;">you</span> <i>(example)</i> very much for my lovely birthday present.
          </p>
          <p style="margin-bottom:16px;">
            When I opened it, I was very happy because I wanted a CD player and now I've (1) <input type="text" class="input-reading" id="p7_q1" value="${userAnswers.p7.q1}" style="width:130px;"> one!
          </p>
          <p style="margin-bottom:16px;">
            Dad bought me three CDs last week so I can listen (2) <input type="text" class="input-reading" id="p7_q2" value="${userAnswers.p7.q2}" style="width:130px;"> them in my bedroom now!
          </p>
          <p style="margin-bottom:16px;">
            I had an excellent party with all my friends. We played a lot of different (3) <input type="text" class="input-reading" id="p7_q3" value="${userAnswers.p7.q3}" style="width:140px;"> in the living room and Mum made a birthday cake. We (4) <input type="text" class="input-reading" id="p7_q4" value="${userAnswers.p7.q4}" style="width:130px;"> going to come and see you (5) <input type="text" class="input-reading" id="p7_q5" value="${userAnswers.p7.q5}" style="width:130px;"> week.
          </p>
          <p style="margin-top:20px;">
            Love from,<br>
            <b>Sarah</b>
          </p>
        </div>
        <div class="bottom-bar">
          <button class="btn-act btn-prev" onclick="savePart7(); prevPart(6);">⬅ Back</button>
          <button class="btn-act btn-next" onclick="savePart7(); finishExam();">Finish Exam ➔</button>
        </div>
      `;
    }

    function savePart7() {
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById(`p7_q${i}`);
        if (el) userAnswers.p7[`q${i}`] = el.value.trim();
      }
    }

    // ==========================================
    // SCORE CALCULATION & DETAILED FEEDBACK
    // ==========================================
    function finishExam() {
      savePart7();
      currentPart = 8;
      renderScreen();
    }

    function renderResults(mount) {
      clearInterval(timerInterval);

      let totalScore = 0;
      let fb = { p1: [], p2: [], p3: [], p4: [], p5: [], p6: [], p7: [] };

      // Part 1 (10 marks)
      for (let k in answerKey.p1) {
        const u = cleanInput(userAnswers.p1[k]);
        const isOk = answerKey.p1[k].includes(u);
        if (isOk) totalScore++;
        fb.p1.push({ q: k.toUpperCase(), user: userAnswers.p1[k] || "(empty)", correct: answerKey.p1[k][0], ok: isOk });
      }

      // Part 2 (7 marks)
      for (let k in answerKey.p2) {
        const u = (userAnswers.p2[k] || "").toLowerCase();
        const isOk = u === answerKey.p2[k];
        if (isOk) totalScore++;
        fb.p2.push({ q: k.toUpperCase(), user: userAnswers.p2[k] || "(empty)", correct: answerKey.p2[k], ok: isOk });
      }

      // Part 3 (5 marks)
      for (let k in answerKey.p3) {
        const u = (userAnswers.p3[k] || "").toUpperCase();
        const isOk = u === answerKey.p3[k];
        if (isOk) totalScore++;
        fb.p3.push({ q: k.toUpperCase(), user: userAnswers.p3[k] || "(empty)", correct: answerKey.p3[k], ok: isOk });
      }

      // Part 4 (6 marks: 5 cloze + 1 title)
      for (let k of ["q1","q2","q3","q4","q5"]) {
        const u = cleanInput(userAnswers.p4[k]);
        const isOk = answerKey.p4[k].includes(u);
        if (isOk) totalScore++;
        fb.p4.push({ q: k.toUpperCase(), user: userAnswers.p4[k] || "(empty)", correct: answerKey.p4[k][0], ok: isOk });
      }
      const titleOk = userAnswers.p4.q6 === answerKey.p4.q6;
      if (titleOk) totalScore++;
      fb.p4.push({ q: "Q6 (TITLE)", user: userAnswers.p4.q6 || "(empty)", correct: answerKey.p4.q6, ok: titleOk });

      // Part 5 (7 marks)
      for (let k in answerKey.p5) {
        const u = cleanInput(userAnswers.p5[k]);
        const isOk = answerKey.p5[k].some(ans => cleanInput(ans) === u);
        if (isOk) totalScore++;
        fb.p5.push({ q: k.toUpperCase(), user: userAnswers.p5[k] || "(empty)", correct: answerKey.p5[k][0], ok: isOk });
      }

      // Part 6 (10 marks)
      for (let k in answerKey.p6) {
        const u = cleanInput(userAnswers.p6[k]);
        const isOk = answerKey.p6[k];
        if (u === isOk) totalScore++;
        fb.p6.push({ q: k.toUpperCase(), user: userAnswers.p6[k] || "(empty)", correct: answerKey.p6[k], ok: u === isOk });
      }

      // Part 7 (5 marks)
      for (let k in answerKey.p7) {
        const u = cleanInput(userAnswers.p7[k]);
        const isOk = answerKey.p7[k].includes(u);
        if (isOk) totalScore++;
        fb.p7.push({ q: k.toUpperCase(), user: userAnswers.p7[k] || "(empty)", correct: answerKey.p7[k].join(' / '), ok: isOk });
      }

      let shields = 1;
      if (totalScore >= 40) shields = 5;
      else if (totalScore >= 32) shields = 4;
      else if (totalScore >= 24) shields = 3;
      else if (totalScore >= 16) shields = 2;

      function renderFbSection(title, list) {
        return `
          <div class="feedback-part-title">${title}</div>
          ${list.map(item => `
            <div class="feedback-item-row">
              <span class="fb-tag ${item.ok ? 'fb-correct' : 'fb-wrong'}">${item.ok ? 'CORRECT' : 'REVIEW'}</span>
              <div>
                <b>${item.q}:</b> Your answer: <i>"${item.user}"</i> 
                ${!item.ok ? `➔ Correct: <b style="color:#0b5cab;">${item.correct}</b>` : ''}
              </div>
            </div>
          `).join('')}
        `;
      }

      mount.innerHTML = `
        <div style="text-align:center; margin-bottom:30px;">
          <h2 style="font-family:'Fredoka'; font-size:42px; color:#0b5cab;">A2 Flyers Mock Test 6 Completed! 🎉</h2>
          <p style="color:var(--text-sub); font-size:22px; font-weight:700; margin-top:8px;">Reading & Writing Component</p>
          <div style="font-size:44px; margin:20px 0;">
            ${"🛡️".repeat(shields)} ${"⚪".repeat(5 - shields)}
          </div>
          <div style="font-family:'Fredoka'; font-size:32px; color:#15803d;">
            Score: ${totalScore} / 44 (${Math.round((totalScore/44)*100)}%) • ${shields} Shields
          </div>
        </div>

        <div class="feedback-panel-card">
          <h3 style="font-family:'Fredoka'; color:#0b5cab; font-size:28px; margin-bottom:16px;">Detailed Pedagogical Feedback</h3>
          ${renderFbSection("Part 1 — Definitions & Vocabulary", fb.p1)}
          ${renderFbSection("Part 2 — Picture Verification (yes / no)", fb.p2)}
          ${renderFbSection("Part 3 — Dialogue Matching (A–H)", fb.p3)}
          ${renderFbSection("Part 4 — Story Cloze & Title", fb.p4)}
          ${renderFbSection("Part 5 — The New Computer", fb.p5)}
          ${renderFbSection("Part 6 — Dinosaurs (Grammar Cloze)", fb.p6)}
          ${renderFbSection("Part 7 — Open Cloze: Letter to Aunt Sally", fb.p7)}
        </div>

        <div class="bottom-bar" style="justify-content:center; gap:20px;">
          <button class="btn-act btn-prev" onclick="location.reload()">🔄 Try Mock Again</button>
          <a href="index.html" class="btn-act btn-finish-all">Complete & Return to Map 🗺️</a>
        </div>
      `;
    }

    renderScreen();
  </script>
</body>
</html>
