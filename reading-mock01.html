<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Flyers Mock 01 - Reading & Writing | Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-sky: #dcf2ff;
      --bubble-cyan: #00c4cc;
      --bubble-blue: #0284c7;
      --bubble-yellow: #ffb800;
      --bubble-orange: #ff5722;
      --bubble-green: #00d084;
      --bubble-purple: #7928ca;
      --text-dark: #121829;
      --text-sub: #334155;
      --white: #ffffff;
      --card-border: #a5d8ff;
      --correct: #00d084;
      --wrong: #ff5722;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #b3e0ff 0%, #dbf0ff 40%, #fff2d6 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      font-size: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .glowing-aura {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 7s ease-in-out infinite alternate;
    }
    .aura-cyan { width: 550px; height: 550px; background: rgba(0, 196, 204, 0.4); top: -120px; left: -100px; }
    .aura-yellow { width: 620px; height: 620px; background: rgba(255, 184, 0, 0.35); bottom: -120px; right: -100px; animation-delay: -3.5s; }
    .aura-purple { width: 480px; height: 480px; background: rgba(121, 40, 202, 0.28); top: 35%; right: 25%; animation-delay: -5s; }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.65; }
      50% { transform: scale(1.22) translate(35px, 25px); opacity: 1; filter: blur(120px); }
      100% { transform: scale(0.92) translate(-25px, -18px); opacity: 0.65; }
    }

    .top-nav {
      height: 86px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn-back-home {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-radius: 999px;
      padding: 10px 24px;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-sub);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .btn-back-home:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #cbd5e1; }

    .exam-tag {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      color: #0b5cab;
      background: #e1f2ff;
      border: 3px solid #bfe3ff;
      padding: 10px 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-badge {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      color: #523100;
      background: #fff3cc;
      border: 3.5px solid #ffcc00;
      padding: 8px 24px;
      border-radius: 999px;
      box-shadow: 0 5px 0 #e6b800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-wrap {
      max-width: 1240px;
      width: 100%;
      margin: 30px auto 50px auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .exam-card {
      background: rgba(255, 255, 255, 0.98);
      border: 5px solid var(--card-border);
      border-radius: 40px;
      padding: 42px;
      box-shadow: 0 18px 40px rgba(37, 117, 252, 0.16);
      position: relative;
    }

    .part-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 20px;
    }

    .part-title {
      font-family: 'Fredoka', cursive;
      font-size: 32px;
      color: #0b5cab;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .instructions-box {
      background: #f0f8ff;
      border-left: 10px solid var(--bubble-cyan);
      border-radius: 0 24px 24px 0;
      padding: 20px 28px;
      font-size: 21px;
      color: #1e293b;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.55;
    }

    /* CONTENEDOR ENCUADRADO PERFECTO DE IMAGEN (SIN DEFORMACIONES) */
    .scene-frame-box {
      width: 100%;
      max-width: 980px;
      margin: 0 auto 28px auto;
      border-radius: 28px;
      overflow: hidden;
      border: 4.5px solid var(--card-border);
      background: #eef7fc;
      box-shadow: 0 12px 28px rgba(37, 117, 252, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene-frame-box img {
      width: 100%;
      max-height: 480px;
      height: auto;
      object-fit: contain;
      display: block;
    }

    /* PART 1 WORDS GRID */
    .words-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
      background: #f8fbff;
      padding: 20px;
      border-radius: 24px;
      border: 3.5px solid var(--card-border);
    }

    .word-badge-item {
      background: #ffffff;
      border: 2.5px solid #cbd5e1;
      border-radius: 16px;
      padding: 10px 16px;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      color: #0b5cab;
      font-weight: 700;
      text-align: center;
      box-shadow: 0 4px 0 #cbd5e1;
    }

    .qa-card-row {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 22px;
      padding: 18px 24px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
      box-shadow: 0 6px 14px rgba(37, 117, 252, 0.06);
    }

    .qa-sentence-text {
      font-size: 20px;
      font-weight: 700;
      color: #1e293b;
      flex: 1;
      min-width: 280px;
    }

    .qa-input-clean {
      font-family: 'Quicksand', sans-serif;
      font-size: 20px;
      font-weight: 800;
      padding: 10px 20px;
      border: 3.5px solid var(--bubble-blue);
      border-radius: 16px;
      outline: none;
      width: 260px;
      color: #0b5cab;
      background: #f8fbfe;
      transition: all 0.2s;
    }
    .qa-input-clean:focus {
      border-color: var(--bubble-cyan);
      box-shadow: 0 0 0 6px rgba(0, 196, 204, 0.25);
      background: #ffffff;
    }

    /* PART 2 YES/NO BUTTONS */
    .yes-no-group {
      display: flex;
      gap: 12px;
    }

    .btn-yes-no {
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      font-weight: 700;
      padding: 10px 28px;
      border-radius: 999px;
      border: 3px solid #cbd5e1;
      background: #ffffff;
      color: #475569;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .btn-yes-no:hover {
      border-color: var(--bubble-cyan);
      transform: translateY(-2px);
    }
    .btn-yes-no.selected-yes {
      background: var(--bubble-green);
      border-color: #0d8a44;
      color: #ffffff;
      box-shadow: 0 5px 0 #0d8a44;
    }
    .btn-yes-no.selected-no {
      background: var(--bubble-orange);
      border-color: #d83d0f;
      color: #ffffff;
      box-shadow: 0 5px 0 #b32a00;
    }

    /* PART 3 DIALOGUE DROPDOWNS */
    .dialogue-bubble-box {
      background: #f8fbff;
      border: 3.5px solid var(--card-border);
      border-radius: 26px;
      padding: 24px;
      margin-bottom: 22px;
    }

    .dialogue-turn {
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 20px;
      font-weight: 700;
    }

    .dialogue-speaker {
      font-family: 'Fredoka', cursive;
      color: #0b5cab;
      min-width: 110px;
      font-size: 22px;
    }

    .dialogue-dropdown {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      font-weight: 700;
      color: var(--bubble-orange);
      padding: 8px 16px;
      border-radius: 14px;
      border: 3.5px solid #1e293b;
      outline: none;
      cursor: pointer;
      background: #ffffff;
    }

    .options-bank-letters {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 24px;
      padding: 22px;
      margin-bottom: 26px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-weight: 700;
    }

    /* FEEDBACK PANEL */
    .feedback-panel-card {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 28px;
      padding: 28px 32px;
      max-width: 900px;
      margin: 28px auto 0 auto;
      text-align: left;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
    }

    .feedback-part-title {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      color: #0b5cab;
      border-bottom: 2.5px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 20px;
      margin-bottom: 12px;
    }
    .feedback-part-title:first-child { margin-top: 0; }

    .feedback-item-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      font-size: 18px;
      line-height: 1.45;
    }

    .fb-tag {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .fb-correct { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
    .fb-wrong { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

    .bottom-bar {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      flex-wrap: wrap;
    }

    .btn-act {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 18px 42px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      transition: all 0.15s ease;
    }

    .btn-next {
      background: linear-gradient(180deg, #2fd277 0%, #15b35c 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #0d8a44, 0 12px 24px rgba(21, 179, 92, 0.4);
    }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #0d8a44; }

    .btn-prev {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      color: #64748b;
      box-shadow: 0 6px 0 #94a3b8;
    }

    @media (max-width: 980px) {
      .top-nav { padding: 0 20px; }
      .exam-card { padding: 24px; }
    }
  </style>
</head>
<body>

  <div class="glowing-aura aura-cyan"></div>
  <div class="glowing-aura aura-yellow"></div>
  <div class="glowing-aura aura-purple"></div>

  <header class="top-nav">
    <a href="index.html" class="btn-back-home">⬅ Exit to Map</a>
    <div class="exam-tag"><span>📖</span> Mock 01 • Reading & Writing</div>
    <div class="timer-badge">
      <span>⏰</span> <span id="timerTxt">40:00</span>
      <span style="font-size:14px; color:#78350f; font-weight:700;">(Practice Mode)</span>
    </div>
  </header>

  <main class="main-wrap">
    <div class="exam-card" id="examMount"></div>
  </main>

  <script>
    let currentPart = 1;

    const userAnswers = {
      p1: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "", q8: "", q9: "", q10: "" },
      p2: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "" },
      p3: { q1: "", q2: "", q3: "", q4: "", q5: "" }
    };

    const answerKey = {
      p1: {
        q1: "a desert",
        q2: "a castle",
        q3: "an actor",
        q4: "a forest",
        q5: "a factory",
        q6: "a cave",
        q7: "a singer",
        q8: "an ocean",
        q9: "a pilot",
        q10: "a hotel"
      },
      p2: {
        q1: "no",
        q2: "yes",
        q3: "yes",
        q4: "no",
        q5: "no",
        q6: "yes",
        q7: "no"
      },
      p3: {
        q1: "B",
        q2: "F",
        q3: "A",
        q4: "E",
        q5: "D"
      }
    };

    function cleanInput(str) {
      return (str || "")
        .toLowerCase()
        .replace(/[’‘`]/g, "'")
        .trim();
    }

    function tryNextExtension(imgEl, baseName, currentIndex = 0) {
      const exts = ['.jpg', '.png', '.jpeg', '.webp', '.svg'];
      if (currentIndex < exts.length) {
        imgEl.onerror = () => tryNextExtension(imgEl, baseName, currentIndex + 1);
        imgEl.src = baseName + exts[currentIndex];
      } else {
        imgEl.style.display = 'none';
      }
    }

    // 40 MIN TIMER CON AUTO-CIERRE
    let secondsLeft = 40 * 60;
    const timerInterval = setInterval(() => {
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        alert("⏰ Time is up! Finishing Reading & Writing test...");
        finishExam();
        return;
      }
      secondsLeft--;
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      const timerEl = document.getElementById('timerTxt');
      if (timerEl) timerEl.textContent = `${m}:${s}`;
    }, 1000);

    function nextPart(step) { currentPart = step; renderScreen(); }
    function prevPart(step) { currentPart = step; renderScreen(); }

    function renderScreen() {
      const mount = document.getElementById('examMount');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (currentPart === 1) renderPart1(mount);
      else if (currentPart === 2) renderPart2(mount);
      else if (currentPart === 3) renderPart3(mount);
      else if (currentPart === 4) renderResults(mount);
    }

    // ==========================================
    // PART 1: DEFINITIONS & WORDS
    // ==========================================
    function renderPart1(mount) {
      const bank = ["a desert", "a castle", "an ocean", "a forest", "a singer", "a pilot", "an actor", "a factory", "a cave", "a hotel", "a waiter", "a circus", "a mountain", "a cinema", "a tent"];

      const questions = [
        { num: 1, text: "This is very hot and dry and there is lots of sand here." },
        { num: 2, text: "Kings and queens used to live in this building a long time ago." },
        { num: 3, text: "This person might work in a theatre or make films." },
        { num: 4, text: "There are lots of trees, plants and wild animals here." },
        { num: 5, text: "People make things like cars or computers inside this big building." },
        { num: 6, text: "This is a dark, cold hole inside a rock or mountain where bats live." },
        { num: 7, text: "You listen to this person when they make music with their voice." },
        { num: 8, text: "This is a huge area of water with big waves and fish." },
        { num: 9, text: "This person flies planes to different countries in the world." },
        { num: 10, text: "You can sleep and eat here when you go on holiday." }
      ];

      let bankHtml = bank.map(w => `<div class="word-badge-item">${w}</div>`).join('');

      let qHtml = questions.map(q => `
        <div class="qa-card-row">
          <div class="qa-sentence-text"><strong>${q.num}.</strong> ${q.text}</div>
          <input type="text" class="qa-input-clean" id="p1_q${q.num}" placeholder="write the word" value="${userAnswers.p1[`q${q.num}`]}">
        </div>
      `).join('');

      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>📝</span> Part 1 — Notice and matching</h2>
        </div>

        <div class="instructions-box">
          Look and read. Choose the correct words and write them on the lines. There is one example.
        </div>

        <div class="words-gallery-grid">${bankHtml}</div>

        <div class="qa-card-row" style="background:#f0fdf4; border-color:#86efac;">
          <div class="qa-sentence-text"><strong>Example:</strong> People go here to watch films and eat popcorn.</div>
          <div style="font-family:'Fredoka',cursive; font-size:22px; color:#15803d; font-weight:700;">a cinema</div>
        </div>

        ${qHtml}

        <div class="bottom-bar">
          <div></div>
          <button class="btn-act btn-next" onclick="savePart1AndNext()">Continue to Part 2 ➔</button>
        </div>
      `;
    }

    function savePart1AndNext() {
      for (let i = 1; i <= 10; i++) {
        const el = document.getElementById(`p1_q${i}`);
        if (el) userAnswers.p1[`q${i}`] = el.value.trim();
      }
      nextPart(2);
    }

    // ==========================================
    // PART 2: LOOK AND READ: YES OR NO (ENCUADRE CORREGIDO)
    // ==========================================
    function renderPart2(mount) {
      const p2Questions = [
        { num: 1, text: "The man with the black beard is wearing green trousers." },
        { num: 2, text: "A purple dinosaur with a long neck is eating leaves from the palm tree." },
        { num: 3, text: "There is a small wooden boat with a red and white spotted flag in the water." },
        { num: 4, text: "The pelican sitting on the rock is looking at the dinosaur." },
        { num: 5, text: "All the clothes on the line are blue and green shorts." },
        { num: 6, text: "Two dolphins are jumping out of the sea on the right of the island." },
        { num: 7, text: "The man sitting next to the red box is reading a comic." }
      ];

      let rowsHtml = p2Questions.map(q => {
        const val = userAnswers.p2[`q${q.num}`];
        const isYes = val === 'yes';
        const isNo = val === 'no';

        return `
          <div class="qa-card-row">
            <div class="qa-sentence-text"><strong>${q.num}.</strong> ${q.text}</div>
            <div class="yes-no-group">
              <button class="btn-yes-no ${isYes ? 'selected-yes' : ''}" onclick="selectYesNo(${q.num}, 'yes')">yes</button>
              <button class="btn-yes-no ${isNo ? 'selected-no' : ''}" onclick="selectYesNo(${q.num}, 'no')">no</button>
            </div>
          </div>
        `;
      }).join('');

      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>🏝️</span> Part 2 — Look and read: yes or no</h2>
        </div>

        <div class="instructions-box">
          Look and read carefully. Choose <strong>yes</strong> or <strong>no</strong> for each sentence according to the scene.
        </div>

        <!-- CONTENEDOR CON LA IMAGEN ENCUADRADA Y SIN DEFORMACIONES -->
        <div class="scene-frame-box">
          <img src="part2-island-m01.jpg" alt="Part 2 Island Scene" onerror="tryNextExtension(this, 'part2-island-m01', 1)">
        </div>

        <div class="qa-card-row" style="background:#f0fdf4; border-color:#86efac;">
          <div class="qa-sentence-text"><strong>Example 1:</strong> There is sand and grass on the island.</div>
          <span style="font-family:'Fredoka',cursive; color:#15803d; font-weight:700; font-size:22px;">yes</span>
        </div>

        <div class="qa-card-row" style="background:#f0fdf4; border-color:#86efac;">
          <div class="qa-sentence-text"><strong>Example 2:</strong> You can see a silver star in the sky.</div>
          <span style="font-family:'Fredoka',cursive; color:#dc2626; font-weight:700; font-size:22px;">no</span>
        </div>

        ${rowsHtml}

        <div class="bottom-bar">
          <button class="btn-act btn-prev" onclick="prevPart(1)">⬅ Back</button>
          <button class="btn-act btn-next" onclick="nextPart(3)">Continue to Part 3 ➔</button>
        </div>
      `;
    }

    function selectYesNo(qNum, choice) {
      userAnswers.p2[`q${qNum}`] = choice;
      renderPart2(document.getElementById('examMount'));
    }

    // ==========================================
    // PART 3: DIALOGUE COMPLETE (LETTERS A-H)
    // ==========================================
    function renderPart3(mount) {
      const letters = ["A", "B", "C", "D", "E", "F", "G", "H"];

      const optionsBank = [
        "A. Yes, we did. We had a picnic in the park.",
        "B. Hi Oliver! It was wonderful, thanks. (Example)",
        "C. I don't like reading science books.",
        "D. Good idea! Let's go and get them now.",
        "E. Only on Saturdays, but I can ask him.",
        "F. My uncle gave it to me for my birthday.",
        "G. No, it was too cold to go swimming.",
        "H. He is watching TV with my mum."
      ];

      const conversation = [
        { q: 1, speaker: "Oliver", text: "Where did you get that amazing new camera, Katy?" },
        { q: 2, speaker: "Oliver", text: "Did you take lots of photos with it at the weekend?" },
        { q: 3, speaker: "Oliver", text: "Can your brother teach me how to use it?" },
        { q: 4, speaker: "Oliver", text: "Shall we print some of your best photos for school?" }
      ];

      let bankListHtml = optionsBank.map(o => `<div>${o}</div>`).join('');

      let dialogueHtml = `
        <div class="dialogue-turn" style="background:#f0fdf4; padding:12px 18px; border-radius:16px;">
          <div class="dialogue-speaker">Oliver:</div>
          <div>Hello Katy, how was your weekend?</div>
          <div style="margin-left:auto; font-family:'Fredoka',cursive; color:#15803d; font-size:22px;">B (Example)</div>
        </div>

        <div class="dialogue-turn">
          <div class="dialogue-speaker">Oliver:</div>
          <div style="flex:1;">Where did you get that amazing new camera, Katy?</div>
          <select class="dialogue-dropdown" id="p3_q1">
            <option value="">?</option>
            ${letters.map(l => `<option value="${l}" ${userAnswers.p3.q1 === l ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>

        <div class="dialogue-turn">
          <div class="dialogue-speaker">Oliver:</div>
          <div style="flex:1;">Did you take lots of photos with it at the weekend?</div>
          <select class="dialogue-dropdown" id="p3_q2">
            <option value="">?</option>
            ${letters.map(l => `<option value="${l}" ${userAnswers.p3.q2 === l ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>

        <div class="dialogue-turn">
          <div class="dialogue-speaker">Oliver:</div>
          <div style="flex:1;">Can your brother teach me how to use it?</div>
          <select class="dialogue-dropdown" id="p3_q3">
            <option value="">?</option>
            ${letters.map(l => `<option value="${l}" ${userAnswers.p3.q3 === l ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>

        <div class="dialogue-turn">
          <div class="dialogue-speaker">Oliver:</div>
          <div style="flex:1;">Shall we print some of your best photos for our school project?</div>
          <select class="dialogue-dropdown" id="p3_q4">
            <option value="">?</option>
            ${letters.map(l => `<option value="${l}" ${userAnswers.p3.q4 === l ? 'selected' : ''}>${l}</option>`).join('')}
          </select>
        </div>
      `;

      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>💬</span> Part 3 — Read the conversation and choose the best answer</h2>
        </div>

        <div class="instructions-box">
          Oliver is talking to Katy. Read the dialogue and choose the best letter (A–H). There is one example.
        </div>

        <div class="options-bank-letters">
          <h4 style="font-family:'Fredoka',cursive; color:#0b5cab; font-size:22px; margin-bottom:8px;">Sentences Bank (A to H):</h4>
          ${bankListHtml}
        </div>

        <div class="dialogue-bubble-box">
          ${dialogueHtml}
        </div>

        <div class="bottom-bar">
          <button class="btn-act btn-prev" onclick="prevPart(2)">⬅ Back</button>
          <button class="btn-act btn-next" onclick="finishExam()">Finish & Check All Answers ➔</button>
        </div>
      `;
    }

    function savePart3() {
      for (let i = 1; i <= 4; i++) {
        const el = document.getElementById(`p3_q${i}`);
        if (el) userAnswers.p3[`q${i}`] = el.value;
      }
    }

    // ==========================================
    // RESULTADOS FINALES Y FEEDBACK
    // ==========================================
    function finishExam() {
      savePart3();

      let score = 0;
      let feedbackList = [];

      // P1 EVALUATION
      for (let i = 1; i <= 10; i++) {
        const user = cleanInput(userAnswers.p1[`q${i}`]);
        const exp = answerKey.p1[`q${i}`];
        if (user === exp || user === exp.replace('a ', '').replace('an ', '')) {
          score++;
          feedbackList.push({ part: 1, ok: true, msg: `Pregunta ${i}: ¡Correcto! Escribiste <strong>${exp}</strong>.` });
        } else {
          feedbackList.push({ part: 1, ok: false, msg: `Pregunta ${i}: Era <strong>${exp}</strong>.` });
        }
      }

      // P2 EVALUATION
      for (let i = 1; i <= 7; i++) {
        const user = userAnswers.p2[`q${i}`];
        const exp = answerKey.p2[`q${i}`];
        if (user === exp) {
          score++;
          feedbackList.push({ part: 2, ok: true, msg: `Pregunta ${i}: ¡Acertaste! Marcaste <strong>${exp}</strong>.` });
        } else {
          feedbackList.push({ part: 2, ok: false, msg: `Pregunta ${i}: La respuesta correcta según la imagen era <strong>${exp}</strong>.` });
        }
      }

      // P3 EVALUATION
      for (let i = 1; i <= 4; i++) {
        const user = userAnswers.p3[`q${i}`];
        const exp = answerKey.p3[`q${i}`];
        if (user === exp) {
          score++;
          feedbackList.push({ part: 3, ok: true, msg: `Pregunta ${i}: ¡Excelente! Elegiste <strong>Letter ${exp}</strong>.` });
        } else {
          feedbackList.push({ part: 3, ok: false, msg: `Pregunta ${i}: Correspondía a <strong>Letter ${exp}</strong>.` });
        }
      }

      // ESCALA DE ESCUDOS
      let shields = 1;
      if (score >= 18) shields = 5;
      else if (score >= 14) shields = 4;
      else if (score >= 10) shields = 3;
      else if (score >= 5) shields = 2;

      localStorage.setItem("flyers_reading_score_01", score);

      const rawMocks = localStorage.getItem("flyers_mocks_status_01_30");
      if (rawMocks) {
        try {
          let st = JSON.parse(rawMocks);
          if (st[1]) {
            st[1].readingWritingScore = score;
            st[1].completed = true;
          }
          if (st[2]) {
            st[2].unlocked = true;
          }
          localStorage.setItem("flyers_mocks_status_01_30", JSON.stringify(st));
        } catch(e) {}
      }

      currentPart = 4;
      renderResults(document.getElementById('examMount'), score, shields, feedbackList);
    }

    function renderResults(mount, score = 0, shields = 3, feedbackList = []) {
      let shieldIcons = "🛡️".repeat(shields);

      let p1Fb = feedbackList.filter(f => f.part === 1).map(f => `<div class="feedback-item-row"><span class="fb-tag ${f.ok ? 'fb-correct' : 'fb-wrong'}">${f.ok ? '✔ Correct' : '✖ Review'}</span> <span>${f.msg}</span></div>`).join('');
      let p2Fb = feedbackList.filter(f => f.part === 2).map(f => `<div class="feedback-item-row"><span class="fb-tag ${f.ok ? 'fb-correct' : 'fb-wrong'}">${f.ok ? '✔ Correct' : '✖ Review'}</span> <span>${f.msg}</span></div>`).join('');
      let p3Fb = feedbackList.filter(f => f.part === 3).map(f => `<div class="feedback-item-row"><span class="fb-tag ${f.ok ? 'fb-correct' : 'fb-wrong'}">${f.ok ? '✔ Correct' : '✖ Review'}</span> <span>${f.msg}</span></div>`).join('');

      mount.innerHTML = `
        <div style="text-align: center; padding: 20px 10px;">
          <h2 style="font-family:'Fredoka',cursive; font-size:46px; color:#0b5cab;">Reading & Writing Complete! 🌟</h2>
          
          <div style="font-size: 64px; margin: 18px 0;">${shieldIcons}</div>
          <p style="font-family:'Fredoka',cursive; font-size:32px; color:#ff5722;">¡Ganaste ${shields} Escudos Cambridge!</p>
          
          <div style="background:#f0f8ff; border:4px solid var(--card-border); border-radius:28px; padding:24px; max-width:700px; margin:20px auto;">
            <p style="font-size:28px; font-weight:800; color:#1e1e4b;">Puntaje: ${score} / 21 puntos</p>
            <p style="color:#64748b; font-weight:700; margin-top:8px; font-size:19px;">¡Completaste con éxito la misión de lectura y escritura del Mock 01!</p>
          </div>

          <div class="feedback-panel-card">
            <div class="feedback-part-title">📝 Part 1 — Definitions & Matching</div>
            ${p1Fb}

            <div class="feedback-part-title">🏝️ Part 2 — Island Scene (yes / no)</div>
            ${p2Fb}

            <div class="feedback-part-title">💬 Part 3 — Oliver & Katy Dialogue</div>
            ${p3Fb}
          </div>

          <!-- BOTONES DE NAVEGACIÓN CORREGIDOS (REDIRECCIÓN DIRECTA AL LISTENING DEL MOCK 02) -->
          <div style="display:flex; justify-content:center; gap:22px; margin-top:36px; flex-wrap:wrap;">
            <a href="index.html" class="btn-act btn-prev" style="text-decoration:none;">⬅ Volver al Mapa</a>
            <a href="listening-mock02.html" class="btn-act btn-next" style="text-decoration:none;">Ir a Mock 02 (Listening) ➔</a>
          </div>
        </div>
      `;
    }

    renderScreen();
  </script>
</body>
</html>
