<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A2 Flyers Mock 08 - Reading & Writing | Dr. Jesús Miguel Lima E.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-sky: #dcf2ff;
      --bubble-cyan: #00c4cc;
      --bubble-blue: #0284c7;
      --bubble-yellow: #ffb800;
      --bubble-orange: #ff5722;
      --bubble-green: #00d084;
      --bubble-purple: #7928ca;
      --text-dark: #121829;
      --text-sub: #334155;
      --white: #ffffff;
      --card-border: #a5d8ff;
      --correct: #00d084;
      --wrong: #ff5722;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #b3e0ff 0%, #dbf0ff 40%, #fff2d6 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      font-size: 20px;
      position: relative;
      overflow-x: hidden;
    }

    .glowing-aura {
      position: fixed;
      border-radius: 50%;
      filter: blur(100px);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 7s ease-in-out infinite alternate;
    }
    .aura-cyan { width: 550px; height: 550px; background: rgba(0, 196, 204, 0.4); top: -120px; left: -100px; }
    .aura-yellow { width: 620px; height: 620px; background: rgba(255, 184, 0, 0.35); bottom: -120px; right: -100px; animation-delay: -3.5s; }
    .aura-purple { width: 480px; height: 480px; background: rgba(121, 40, 202, 0.28); top: 35%; right: 25%; animation-delay: -5s; }

    @keyframes pulseGlow {
      0% { transform: scale(1) translate(0, 0); opacity: 0.65; }
      50% { transform: scale(1.22) translate(35px, 25px); opacity: 1; filter: blur(120px); }
      100% { transform: scale(0.92) translate(-25px, -18px); opacity: 0.65; }
    }

    .top-nav {
      height: 86px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 4px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.12);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
    }

    .btn-back-home {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      border-radius: 999px;
      padding: 10px 24px;
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      font-weight: 700;
      color: var(--text-sub);
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .btn-back-home:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #cbd5e1; }

    .exam-tag {
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      color: #0b5cab;
      background: #e1f2ff;
      border: 3px solid #bfe3ff;
      padding: 10px 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .timer-badge {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      color: #523100;
      background: #fff3cc;
      border: 3.5px solid #ffcc00;
      padding: 8px 24px;
      border-radius: 999px;
      box-shadow: 0 5px 0 #e6b800;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .main-wrap {
      max-width: 1240px;
      width: 100%;
      margin: 30px auto 50px auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    .exam-card {
      background: rgba(255, 255, 255, 0.98);
      border: 5px solid var(--card-border);
      border-radius: 40px;
      padding: 42px;
      box-shadow: 0 18px 40px rgba(37, 117, 252, 0.16);
      position: relative;
    }

    .part-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 18px;
      margin-bottom: 20px;
    }

    .part-title {
      font-family: 'Fredoka', cursive;
      font-size: 32px;
      color: #0b5cab;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .instructions-box {
      background: #f0f8ff;
      border-left: 10px solid var(--bubble-cyan);
      border-radius: 0 24px 24px 0;
      padding: 20px 28px;
      font-size: 21px;
      color: #1e293b;
      font-weight: 700;
      margin-bottom: 28px;
      line-height: 1.55;
    }

    .pill-bank {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      background: #f8fbff;
      padding: 20px;
      border-radius: 28px;
      border: 3.5px dashed var(--card-border);
    }

    .word-pill {
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      background: #ffffff;
      border: 3.5px solid var(--bubble-blue);
      color: var(--bubble-blue);
      padding: 8px 24px;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--bubble-blue);
      transition: all 0.15s ease;
    }
    .word-pill:hover { transform: translateY(-2px); }
    .word-pill.selected {
      background: var(--bubble-orange);
      border-color: #d83d0f;
      color: #ffffff;
      box-shadow: 0 0 20px rgba(255, 87, 34, 0.7), 0 5px 0 #b32a00;
      transform: scale(1.08);
    }
    .word-pill.used {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }

    .reading-content-box {
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 30px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(37, 117, 252, 0.06);
    }

    .qa-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 16px 0;
      border-bottom: 2px dashed #e2e8f0;
      font-weight: 700;
      font-size: 20px;
    }
    .qa-row:last-child { border-bottom: none; }
    .qa-text { flex: 1; line-height: 1.5; }

    .interactive-line-slot {
      min-width: 220px;
      padding: 10px 18px;
      border: 3px dashed var(--bubble-blue);
      border-radius: 16px;
      background: #f8fbff;
      text-align: center;
      font-family: 'Fredoka', cursive;
      font-size: 20px;
      color: var(--bubble-blue);
      cursor: pointer;
      transition: all 0.2s;
    }
    .interactive-line-slot.filled {
      border: 3px solid var(--bubble-cyan);
      background: var(--bubble-cyan);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(0, 196, 204, 0.35);
    }
    .interactive-line-slot.example-slot {
      border: 3px solid var(--bubble-green);
      background: #dcfce7;
      color: #15803d;
      cursor: default;
    }

    .toggle-btn-group {
      display: flex;
      gap: 12px;
      flex-shrink: 0;
    }
    .toggle-btn {
      font-family: 'Fredoka', cursive;
      font-size: 19px;
      padding: 8px 24px;
      border-radius: 999px;
      border: 3px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 4px 0 #cbd5e1;
      transition: all 0.15s ease;
    }
    .toggle-btn:hover { transform: translateY(-2px); }
    .toggle-btn.sel-yes {
      background: var(--bubble-green);
      border-color: #15803d;
      color: #ffffff;
      box-shadow: 0 4px 0 #15803d;
    }
    .toggle-btn.sel-no {
      background: var(--bubble-orange);
      border-color: #c2410c;
      color: #ffffff;
      box-shadow: 0 4px 0 #c2410c;
    }

    .reference-stage {
      text-align: center;
      margin-bottom: 26px;
      border-radius: 28px;
      overflow: hidden;
      border: 4px solid var(--card-border);
      background: #f8fafc;
      box-shadow: 0 10px 25px rgba(0,0,0,0.06);
    }
    .reference-stage img, .reference-stage svg {
      width: 100%;
      max-height: 480px;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .chat-speaker-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 8px;
    }
    .speaker-avatar {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid var(--card-border);
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    .letter-dropdown {
      width: 64px;
      height: 56px;
      border: 3.5px solid var(--text-dark);
      border-radius: 16px;
      background: #ffffff;
      font-family: 'Fredoka', cursive;
      font-size: 26px;
      font-weight: 700;
      color: var(--bubble-orange);
      text-align: center;
      outline: none;
      cursor: pointer;
      box-shadow: 0 4px 0 #94a3b8;
    }
    .letter-dropdown:focus {
      border-color: var(--bubble-cyan);
      box-shadow: 0 0 14px rgba(0, 196, 204, 0.6);
    }

    .input-reading {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 8px 18px;
      border: 3.5px solid var(--card-border);
      border-radius: 16px;
      outline: none;
      color: #0b5cab;
      background: #f8fbfe;
      transition: all 0.2s;
    }
    .input-reading:focus {
      border-color: var(--bubble-cyan);
      background: #ffffff;
      box-shadow: 0 0 0 5px rgba(0, 196, 204, 0.25);
    }

    .title-choice-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 18px 24px;
      border-radius: 20px;
      border: 3.5px solid #cbd5e1;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 5px 0 #cbd5e1;
      font-family: 'Fredoka', cursive;
      font-size: 22px;
      transition: all 0.15s ease;
      color: var(--text-dark);
      margin-bottom: 12px;
    }
    .title-choice-card:hover {
      border-color: var(--bubble-cyan);
      transform: translateY(-2px);
    }
    .title-choice-card.selected {
      background: #f0fdf4;
      border-color: var(--bubble-green);
      color: #15803d;
      box-shadow: 0 5px 0 #15803d;
      transform: scale(1.01);
    }
    .title-choice-card input[type="radio"] {
      width: 24px;
      height: 24px;
      cursor: pointer;
      accent-color: #15803d;
    }

    .story-reading-box {
      font-size: 22px;
      line-height: 2.1;
      color: #1e293b;
      font-weight: 600;
      background: #ffffff;
      border: 4px solid var(--card-border);
      border-radius: 30px;
      padding: 34px;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
      margin-bottom: 28px;
    }

    .cloze-dropdown {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 700;
      color: var(--bubble-blue);
      background: #f8fbff;
      border: 3px solid var(--bubble-blue);
      border-radius: 14px;
      padding: 4px 14px;
      outline: none;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--bubble-blue);
      margin: 0 4px;
    }
    .cloze-dropdown:focus { border-color: var(--bubble-orange); box-shadow: 0 3px 0 #c2410c; }

    .feedback-panel-card {
      background: #ffffff;
      border: 3.5px solid var(--card-border);
      border-radius: 28px;
      padding: 28px 32px;
      max-width: 960px;
      margin: 28px auto 0 auto;
      text-align: left;
      box-shadow: 0 10px 24px rgba(37, 117, 252, 0.08);
    }
    .feedback-part-title {
      font-family: 'Fredoka', cursive;
      font-size: 24px;
      color: #0b5cab;
      border-bottom: 2.5px solid #e2e8f0;
      padding-bottom: 8px;
      margin-top: 24px;
      margin-bottom: 12px;
    }
    .feedback-part-title:first-child { margin-top: 0; }
    .feedback-item-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 8px 0;
      font-size: 18px;
      line-height: 1.45;
    }
    .fb-tag {
      font-family: 'Fredoka', cursive;
      font-size: 15px;
      font-weight: 700;
      padding: 3px 12px;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .fb-correct { background: #dcfce7; color: #15803d; border: 1.5px solid #86efac; }
    .fb-wrong { background: #fee2e2; color: #b91c1c; border: 1.5px solid #fca5a5; }

    .bottom-bar {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 22px;
      flex-wrap: wrap;
    }
    .btn-act {
      font-family: 'Fredoka', cursive;
      font-size: 21px;
      font-weight: 600;
      padding: 18px 42px;
      border-radius: 999px;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn-next {
      background: linear-gradient(180deg, #2fd277 0%, #15b35c 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #0d8a44, 0 12px 24px rgba(21, 179, 92, 0.4);
    }
    .btn-next:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #0d8a44; }

    .btn-finish-all {
      background: linear-gradient(180deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      box-shadow: 0 7px 0 #075985, 0 12px 24px rgba(2, 132, 199, 0.4);
    }
    .btn-finish-all:hover { transform: translateY(-3px); box-shadow: 0 10px 0 #075985; }

    .btn-prev {
      background: #ffffff;
      border: 3.5px solid #cbd5e1;
      color: #64748b;
      box-shadow: 0 6px 0 #94a3b8;
    }

    @media (max-width: 980px) {
      .top-nav { padding: 0 20px; }
      .exam-card { padding: 24px; }
      .qa-row { flex-direction: column; align-items: flex-start; }
      .interactive-line-slot { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="glowing-aura aura-cyan"></div>
  <div class="glowing-aura aura-yellow"></div>
  <div class="glowing-aura aura-purple"></div>

  <header class="top-nav">
    <a href="index.html" class="btn-back-home">⬅ Exit to Map</a>
    <div class="exam-tag"><span>📖</span> Mock 08 • Reading & Writing</div>
    <div class="timer-badge">
      <span>⏰</span> <span id="timerTxt">45:00</span>
      <span style="font-size:14px; color:#78350f; font-weight:700;">(Practice Mode)</span>
    </div>
  </header>

  <main class="main-wrap">
    <div class="exam-card" id="examMount"></div>
  </main>

  <script>
    let currentPart = 1;
    let selectedWordP1 = null;

    const userAnswers = {
      p1: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "", q8: "", q9: "", q10: "" },
      p2: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "" },
      p3: { q1: "", q2: "", q3: "", q4: "", q5: "" },
      p4: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "" },
      p5: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "" },
      p6: { q1: "", q2: "", q3: "", q4: "", q5: "", q6: "", q7: "", q8: "", q9: "", q10: "" },
      p7: { q1: "", q2: "", q3: "", q4: "", q5: "" }
    };

    // Official Cambridge Flyers Mock 08 Answer Key
    const answerKey = {
      p1: {
        q1: ["a stamp"],
        q2: ["wood"],
        q3: ["a train"],
        q4: ["a ruler"],
        q5: ["a bicycle"],
        q6: ["gold"],
        q7: ["soap"],
        q8: ["an ambulance"],
        q9: ["postcards"],
        q10: ["glass"]
      },
      p2: {
        q1: "yes",
        q2: "no",
        q3: "no",
        q4: "yes",
        q5: "yes",
        q6: "no",
        q7: "no"
      },
      p3: {
        q1: "E",
        q2: "H",
        q3: "A",
        q4: "F",
        q5: "B"
      },
      p4: {
        q1: ["store"],
        q2: ["bowl"],
        q3: ["cut"],
        q4: ["ready"],
        q5: ["hungry"],
        q6: "Mr Brown eats too much"
      },
      p5: {
        q1: ["midnight", "12", "twelve", "12 o'clock", "twelve o'clock", "12 am", "twelve am"],
        q2: ["animals"],
        q3: ["the living room", "living room"],
        q4: ["fruit and vegetables", "fruit vegetables"],
        q5: ["at home with katy", "with katy", "at home with his sister", "with his sister", "at home"],
        q6: ["david play with katy"],
        q7: ["very tired", "tired"]
      },
      p6: {
        q1: "for",
        q2: "have",
        q3: "to",
        q4: "there",
        q5: "doesn't",
        q6: "biggest",
        q7: "called",
        q8: "who",
        q9: "forget",
        q10: "than"
      },
      p7: {
        q1: ["top"],
        q2: ["to"],
        q3: ["going"],
        q4: ["evening", "afternoon"],
        q5: ["were"]
      }
    };

    function cleanInput(str) {
      return (str || "")
        .toLowerCase()
        .replace(/[’‘`]/g, "'")
        .replace(/[^\w\s']/g, "")
        .trim();
    }

    function tryMultipleBases(imgEl, baseNames, currentBaseIdx = 0, currentExtIdx = 0) {
      const exts = ['.jpg', '.png', '.jpeg', '.webp', '.svg'];
      if (currentBaseIdx < baseNames.length) {
        if (currentExtIdx < exts.length) {
          imgEl.onerror = () => tryMultipleBases(imgEl, baseNames, currentBaseIdx, currentExtIdx + 1);
          imgEl.src = baseNames[currentBaseIdx] + exts[currentExtIdx];
        } else {
          tryMultipleBases(imgEl, baseNames, currentBaseIdx + 1, 0);
        }
      } else {
        imgEl.style.display = 'none';
      }
    }

    let secondsLeft = 45 * 60;
    const timerInterval = setInterval(() => {
      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        alert("⏰ Practice Time is up! Reviewing your scores now...");
        finishExam();
        return;
      }
      secondsLeft--;
      const m = Math.floor(secondsLeft / 60).toString().padStart(2, '0');
      const s = (secondsLeft % 60).toString().padStart(2, '0');
      const timerEl = document.getElementById('timerTxt');
      if (timerEl) timerEl.textContent = `${m}:${s}`;
    }, 1000);

    function nextPart(step) { currentPart = step; renderScreen(); }
    function prevPart(step) { currentPart = step; renderScreen(); }

    function renderScreen() {
      const mount = document.getElementById('examMount');
      window.scrollTo({ top: 0, behavior: 'smooth' });

      if (currentPart === 1) renderPart1(mount);
      else if (currentPart === 2) renderPart2(mount);
      else if (currentPart === 3) renderPart3(mount);
      else if (currentPart === 4) renderPart4(mount);
      else if (currentPart === 5) renderPart5(mount);
      else if (currentPart === 6) renderPart6(mount);
      else if (currentPart === 7) renderPart7(mount);
      else if (currentPart === 8) renderResults(mount);
    }

    // ==========================================
    // PART 1: DEFINITIONS (10 Questions)
    // ==========================================
    function renderPart1(mount) {
      const words = [
        "gold", "newspapers", "a train", "scissors", "glass",
        "soap", "postcards", "paper", "a ruler", "a lorry",
        "wood", "a stamp", "a bicycle", "an ambulance"
      ];

      const questions = [
        { id: "q1", text: "If you want to post a letter you usually have to put this on the envelope." },
        { id: "q2", text: "This comes from trees and people make a lot of things with it, for example, tables, chairs and shelves." },
        { id: "q3", text: "This can take a lot of people from one place to another. You wait at stations for it." },
        { id: "q4", text: "You use this to draw straight lines. It is made of plastic." },
        { id: "q5", text: "You ride on this and you have to use your legs to make it go." },
        { id: "q6", text: "This yellow metal comes from rocks in the ground and it is very expensive and very beautiful." },
        { id: "q7", text: "This usually smells nice and people use it when they wash their hands." },
        { id: "q8", text: "If someone is ill, this can take them quickly through the traffic to the hospital." },
        { id: "q9", text: "People usually write on these and send them to their friends and family when they are on holiday." },
        { id: "q10", text: "Windows are made of this because you can see through it, but it is easy to break." }
      ];

      let bankHtml = words.map(w => {
        const isUsed = Object.values(userAnswers.p1).includes(w);
        const isSel = selectedWordP1 === w;
        return `<button class="word-pill ${isUsed ? 'used' : ''} ${isSel ? 'selected' : ''}" onclick="pickWordP1('${w}')">${w}</button>`;
      }).join('');

      let listHtml = questions.map((q, idx) => {
        const val = userAnswers.p1[q.id] || "Choose word";
        const isFilled = val !== "Choose word";
        return `
          <div class="qa-row">
            <div class="qa-text"><b>${idx + 1}.</b>${q.text}</div>
            <div class="interactive-line-slot ${isFilled ? 'filled' : ''}" onclick="placeWordP1('${q.id}')">${val}</div>
          </div>
        `;
      }).join('');

      mount.innerHTML = `
        <div class="part-banner">
          <h2 class="part-title"><span>📚</span> Part 1 — Definitions & Vocabulary</h2>
